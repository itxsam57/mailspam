name: RFC8058 wiring temporary
on:
  push:
    branches:
      - m2-rfc8058-one-click-integrity
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2-rfc8058-one-click-integrity
      - shell: python
        run: |
          from pathlib import Path

          # Wire bounded raw DKIM coverage metadata into canonical MIME output.
          p = Path('server/src/util/mimeNormalize.ts')
          s = p.read_text()
          anchor = 'import { analyzeHtmlInteractions, MAX_HTML_INTERACTION_CHARS } from "./htmlInteraction.js";\n'
          imp = anchor + 'import { extractOneClickDkimCoverage } from "./dkimSignatureMetadata.js";\n'
          if 'extractOneClickDkimCoverage' not in s:
              if anchor not in s: raise SystemExit('mime import anchor missing')
              s = s.replace(anchor, imp, 1)
          old = '    listHeaders: { listId, listUnsubscribe, listUnsubscribePost },'
          new = '    listHeaders: { listId, listUnsubscribe, listUnsubscribePost, oneClickDkimCoverage: extractOneClickDkimCoverage(raw) },'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('mime listHeaders anchor missing')
          p.write_text(s)

          # Expose exact trusted passing DKIM domain+selector identities.
          p = Path('server/src/engine/identitySignals.ts')
          s = p.read_text()
          s = s.replace(
              'function authenticationProperty(segment: string, property: "smtp.mailfrom" | "header.d"): string | null {',
              'function authenticationProperty(segment: string, property: "smtp.mailfrom" | "header.d" | "header.s"): string | null {',
              1,
          )
          insert_after = '''export function authenticationResultsTrusted(envelope: CanonicalEnvelope): boolean {
  return envelope.authentication.providerTrust === "trusted";
}
'''
          helper = insert_after + '''
export interface TrustedPassingDkimIdentity {
  domain: string;
  selector: string;
}
'''
          if 'export interface TrustedPassingDkimIdentity' not in s:
              if insert_after not in s: raise SystemExit('identity trust anchor missing')
              s = s.replace(insert_after, helper, 1)
          domain_fn_end = '''function authenticationIdentityDomain(raw: string | null): string | null {
  if (!raw) return null;
  const value = raw.trim().replace(/^<|>$/g, "").replace(/^\\[|\\]$/g, "");
  if (!value || value === "<>") return null;
  const domain = value.includes("@") ? value.slice(value.lastIndexOf("@") + 1) : value;
  const normalized = normalizeDomainName(domain.replace(/[>,]+$/g, ""));
  return /^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z0-9-]{2,63}$/i.test(normalized)
    ? normalized
    : null;
}
'''
          trusted_helper = domain_fn_end + '''
function authenticationSelector(raw: string | null): string | null {
  const selector = (raw ?? "").trim().toLowerCase();
  if (!selector || selector.length > 253) return null;
  return /^[a-z0-9](?:[a-z0-9._-]*[a-z0-9])?$/i.test(selector) ? selector : null;
}

/** Trusted DKIM pass identities used for exact signature/selector correlation. */
export function trustedPassingDkimIdentities(envelope: CanonicalEnvelope): TrustedPassingDkimIdentity[] {
  if (!authenticationResultsTrusted(envelope) || !envelope.authentication.rawHeader) return [];
  const identities = new Map<string, TrustedPassingDkimIdentity>();
  const pattern = /(?:^|;)\\s*dkim\\s*=\\s*pass\\b([^;]*)/gi;
  let result: RegExpExecArray | null;
  while ((result = pattern.exec(envelope.authentication.rawHeader))) {
    const segment = result[1] ?? "";
    const domain = authenticationIdentityDomain(authenticationProperty(segment, "header.d"));
    const selector = authenticationSelector(authenticationProperty(segment, "header.s"));
    if (!domain || !selector) continue;
    identities.set(`${domain}\\0${selector}`, { domain, selector });
  }
  return [...identities.values()];
}
'''
          if 'export function trustedPassingDkimIdentities' not in s:
              if domain_fn_end not in s: raise SystemExit('identity domain helper anchor missing')
              s = s.replace(domain_fn_end, trusted_helper, 1)
          p.write_text(s)

          # Gate automatic one-click POST on trusted DKIM pass + exact raw signature coverage.
          p = Path('server/src/workflows/unsubscribe.ts')
          s = p.read_text()
          import_anchor = 'import type { CanonicalEnvelope } from "../canonical/envelope.js";\n'
          import_new = import_anchor + 'import { trustedPassingDkimIdentities } from "../engine/identitySignals.js";\n'
          if 'trustedPassingDkimIdentities' not in s:
              if import_anchor not in s: raise SystemExit('unsubscribe import anchor missing')
              s = s.replace(import_anchor, import_new, 1)
          capability_anchor = '''/**
 * Every canonical provider uses this same capability resolver. RFC 8058 is
 * preferred, but normal List-Unsubscribe links, mailto actions, and explicit
 * footer unsubscribe links are also exposed to the user.
 */
'''
          auth_helper = '''function oneClickDkimAuthorized(envelope: CanonicalEnvelope): boolean {
  const coverage = envelope.listHeaders.oneClickDkimCoverage ?? [];
  if (coverage.length === 0) return false;

  for (const identity of trustedPassingDkimIdentities(envelope)) {
    const matches = coverage.filter((item) => item.domain === identity.domain && item.selector === identity.selector);
    if (matches.length === 1) return true;
  }
  return false;
}

''' + capability_anchor
          if 'function oneClickDkimAuthorized' not in s:
              if capability_anchor not in s: raise SystemExit('unsubscribe capability anchor missing')
              s = s.replace(capability_anchor, auth_helper, 1)
          s = s.replace(
              '  if (oneClickDeclared && httpsTarget) {',
              '  if (oneClickDeclared && httpsTarget && oneClickDkimAuthorized(envelope)) {',
              1,
          )
          p.write_text(s)
      - shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+itxsam57@users.noreply.github.com
          git add server/src/util/mimeNormalize.ts server/src/engine/identitySignals.ts server/src/workflows/unsubscribe.ts
          git commit -m "Require DKIM authorization for RFC8058 one-click"
          git push origin HEAD:m2-rfc8058-one-click-integrity
