name: Final Flight Recorder Consolidation

on:
  push:
    branches:
      - design/full-product-flight-recorder-20260816

permissions:
  contents: write

jobs:
  consolidate:
    if: "${{ github.event.head_commit.message == 'chore: trigger final flight recorder consolidation' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/full-product-flight-recorder-20260816
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reconcile final high-value trace terminals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          onboarding_path=Path('web/consumer-provider-onboarding.js')
          onboarding=onboarding_path.read_text(encoding='utf-8')
          if 'provider.connect.gmail.ui_confirmed' not in onboarding:
              marker=onboarding.rfind('})();')
              if marker < 0:
                  raise SystemExit('consumer-provider-onboarding IIFE terminator missing')
              addition=r'''

  // Final-testing trace terminal: connection is visibly complete only when the
  // consumer account list gains an entry. No account ID or visible text is read.
  const traceAccountsList = document.getElementById('accountsList');
  let traceProviderBaseline = null;
  if (traceAccountsList) {
    document.addEventListener('click', (event) => {
      if (event.isTrusted === false) return;
      const workflowId = window.emailShieldRuntimeTrace?.currentWorkflowId?.();
      if (typeof workflowId !== 'string' || !workflowId.startsWith('provider.connect.')) return;
      traceProviderBaseline = traceAccountsList.childElementCount;
    }, true);
    new MutationObserver(() => {
      const trace = window.emailShieldRuntimeTrace;
      const workflowId = trace?.currentWorkflowId?.();
      if (traceProviderBaseline === null || typeof workflowId !== 'string') return;
      if (traceAccountsList.childElementCount <= traceProviderBaseline) return;
      if (workflowId === 'provider.connect.gmail') {
        trace.checkpoint('provider.connect.gmail.provider_authenticated', 'success', { stage: 'provider', component: 'gmail_oauth_status' });
        trace.checkpoint('provider.connect.gmail.connection_persisted', 'success', { stage: 'storage', component: 'gmail_oauth_status' });
        trace.checkpoint('provider.connect.gmail.ui_confirmed');
      } else if (workflowId === 'provider.connect.icloud') trace.checkpoint('provider.connect.icloud.ui_confirmed');
      else if (workflowId === 'provider.connect.yahoo') trace.checkpoint('provider.connect.yahoo.ui_confirmed');
      else if (workflowId === 'provider.connect.imap') trace.checkpoint('provider.connect.imap.ui_confirmed');
      else return;
      traceProviderBaseline = null;
    }).observe(traceAccountsList, { childList: true });
  }
'''
              onboarding=onboarding[:marker]+addition+onboarding[marker:]
          elif 'provider.connect.gmail.provider_authenticated' not in onboarding:
              old="if (workflowId === 'provider.connect.gmail') trace.checkpoint('provider.connect.gmail.ui_confirmed');"
              new="""if (workflowId === 'provider.connect.gmail') {
        trace.checkpoint('provider.connect.gmail.provider_authenticated', 'success', { stage: 'provider', component: 'gmail_oauth_status' });
        trace.checkpoint('provider.connect.gmail.connection_persisted', 'success', { stage: 'storage', component: 'gmail_oauth_status' });
        trace.checkpoint('provider.connect.gmail.ui_confirmed');
      }"""
              if onboarding.count(old) != 1:
                  raise SystemExit('Gmail visible confirmation exists but canonical single-line form was not found')
              onboarding=onboarding.replace(old,new,1)
          onboarding_path.write_text(onboarding,encoding='utf-8')

          trace_path=Path('web/runtime-workflow-trace.js')
          trace=trace_path.read_text(encoding='utf-8')
          if 'uncaught_browser_error' not in trace:
              anchor="  Object.defineProperty(window, 'emailShieldRuntimeTrace', {"
              if trace.count(anchor) != 1:
                  raise SystemExit('runtime trace public API anchor missing')
              addition=r'''  function safeBrowserErrorLocation(filename, line, column) {
    if (typeof filename !== 'string' || !filename) return null;
    const lineNumber = Number(line);
    const columnNumber = Number(column);
    if (!Number.isSafeInteger(lineNumber) || lineNumber < 1 || lineNumber > 2_000_000) return null;
    if (!Number.isSafeInteger(columnNumber) || columnNumber < 0 || columnNumber > 2_000_000) return null;
    try {
      const parsed = new URL(filename, window.location.origin);
      if (parsed.origin !== window.location.origin) return null;
      const cleanPath = parsed.pathname.replace(/^\/+/, '');
      if (!cleanPath || !/^[A-Za-z0-9_.\/-]{1,120}$/.test(cleanPath) || cleanPath.includes('..')) return null;
      const sourcePath = cleanPath.startsWith('web/') ? cleanPath : `web/${cleanPath}`;
      const locationId = `${sourcePath}:${lineNumber}:${columnNumber}`;
      return /^[A-Za-z0-9_.:/-]{1,159}$/.test(locationId) ? locationId : null;
    } catch { return null; }
  }

  function recordBrowserRuntimeFailure(errorCode, errorLocationId) {
    const context = current() || automaticRoot('ui.runtime_error', 'browser_runtime');
    if (!context) return;
    checkpointFor(context, `${context.workflowId}.runtime_error`, 'failed', {
      stage: 'ui_render', component: 'browser_runtime', errorCode,
      ...(errorLocationId ? { errorLocationId } : {}),
    });
  }

  window.addEventListener('error', (event) => {
    const errorLocationId = safeBrowserErrorLocation(event.filename, event.lineno, event.colno);
    recordBrowserRuntimeFailure('uncaught_browser_error', errorLocationId);
  });
  window.addEventListener('unhandledrejection', () => {
    recordBrowserRuntimeFailure('unhandled_promise_rejection');
  });

'''
              trace=trace.replace(anchor,addition+anchor,1)
              trace_path.write_text(trace,encoding='utf-8')

          registry_path=Path('server/src/diagnostics/workflowRegistry.ts')
          registry=registry_path.read_text(encoding='utf-8')
          if 'automaticWorkflow("ui.runtime_error")' not in registry:
              anchor='  automaticWorkflow("application.startup"),\n'
              if registry.count(anchor) != 1:
                  raise SystemExit('application.startup registry anchor missing')
              registry=registry.replace(anchor,anchor+'  automaticWorkflow("ui.runtime_error"),\n',1)
              registry_path.write_text(registry,encoding='utf-8')

          diagnosis_path=Path('server/src/diagnostics/runtimeTraceDiagnosis.ts')
          diagnosis=diagnosis_path.read_text(encoding='utf-8')
          if 'function browserRuntimeSource' not in diagnosis:
              anchor='function sourceFor(manifest: RuntimeTraceManifest, checkpointId: string | null) {'
              if diagnosis.count(anchor) != 1:
                  raise SystemExit('diagnosis sourceFor anchor missing')
              helper=r'''function browserRuntimeSource(errorLocationId: string | undefined, checkpointId: string | undefined) {
  if (!errorLocationId) return null;
  const match = /^(web\/[A-Za-z0-9_.\/-]{1,120}):(\d{1,7}):(\d{1,7})$/.exec(errorLocationId);
  if (!match) return null;
  const line = Number(match[2]);
  if (!Number.isSafeInteger(line) || line < 1 || line > 2_000_000) return null;
  return { checkpointId: checkpointId ?? 'ui.runtime_error.runtime_error', component: 'browser_runtime', sourcePath: match[1]!, owner: 'runtime_error', line };
}

'''
              diagnosis=diagnosis.replace(anchor,helper+anchor,1)
              old='''  const ownerCheckpoint = terminal?.checkpointId ?? missing ?? lastCheckpointId;
  return {
'''
              new='''  const ownerCheckpoint = terminal?.checkpointId ?? missing ?? lastCheckpointId;
  const runtimeErrorOwner = browserRuntimeSource(terminal?.errorLocationId, terminal?.checkpointId);
  return {
'''
              if diagnosis.count(old) != 1:
                  raise SystemExit('diagnosis owner checkpoint anchor missing')
              diagnosis=diagnosis.replace(old,new,1)
              old_owner='    sourceOwner: sourceFor(manifest, ownerCheckpoint),'
              if diagnosis.count(old_owner) != 1:
                  raise SystemExit('diagnosis source owner expression missing')
              diagnosis=diagnosis.replace(old_owner,'    sourceOwner: runtimeErrorOwner ?? sourceFor(manifest, ownerCheckpoint),',1)
              diagnosis_path.write_text(diagnosis,encoding='utf-8')

          hygiene_path=Path('tests/unit/runtimeTraceScaffoldingCleanup.test.ts')
          hygiene=hygiene_path.read_text(encoding='utf-8')
          if 'trace-finalize' not in hygiene:
              hygiene=hygiene.replace(
                  'expect(workflows.filter((name) => name.startsWith("flight-recorder-") && name !== "")).toEqual([]);',
                  'expect(workflows.filter((name) => name.startsWith("flight-recorder-") || name.includes("trace-finalize") || name === "release-flight-recorder-consolidate.yml")).toEqual([]);',
                  1,
              )
              hygiene=hygiene.replace(
                  'expect(plans.filter((name) => name.startsWith(".flight-recorder-") || name.startsWith(".keep-flight-recorder-red"))).toEqual([]);',
                  'expect(plans.filter((name) => name.startsWith(".flight-recorder-") || name.startsWith(".keep-flight-recorder-red") || name.includes("trace-trigger"))).toEqual([]);',
                  1,
              )
              hygiene_path.write_text(hygiene,encoding='utf-8')
          PY
      - name: Remove every construction-only file
        shell: bash
        run: |
          find .github/workflows -maxdepth 1 -type f \( -name 'flight-recorder-*.yml' -o -name '*trace-finalize.yml' -o -name 'release-flight-recorder-consolidate.yml' \) -print0 | xargs -0 -r git rm -f --ignore-unmatch
          find scripts/engineering -maxdepth 1 -type f \( -name 'apply-flight-recorder-*' -o -name 'reconcile-flight-recorder-*' \) -print0 | xargs -0 -r git rm -f --ignore-unmatch
          find docs/superpowers/plans -maxdepth 1 -type f \( -name '.flight-recorder-*' -o -name '.keep-flight-recorder-red*' -o -name '*trace-trigger*' \) -print0 | xargs -0 -r git rm -f --ignore-unmatch
      - name: Release-head hygiene proof
        shell: bash
        run: |
          test -z "$(find .github/workflows -maxdepth 1 -type f \( -name 'flight-recorder-*.yml' -o -name '*trace-finalize.yml' -o -name 'release-flight-recorder-consolidate.yml' \) -print -quit)"
          test -z "$(find scripts/engineering -maxdepth 1 -type f \( -name 'apply-flight-recorder-*' -o -name 'reconcile-flight-recorder-*' \) -print -quit)"
          test -z "$(find docs/superpowers/plans -maxdepth 1 -type f \( -name '.flight-recorder-*' -o -name '.keep-flight-recorder-red*' -o -name '*trace-trigger*' \) -print -quit)"
      - name: Required architecture assertions
        shell: bash
        run: |
          grep -q 'X-Email-Shield-Workflow-Id' web/local-security.js
          grep -q 'backend_completed' server/src/diagnostics/runtimeTraceResponseBoundary.ts
          grep -R -q 'provider_page_read' server/src
          grep -R -q 'checkpoint_persisted' server/src
          grep -R -q 'provider.restore_sessions' server/src
          grep -R -q 'protection.background.run' server/src
          grep -R -q 'protection.realtime.run' server/src
          grep -q '/api/dev/runtime-trace/diagnosis' server/src/api/runtimeWorkflowTraceRoutes.ts
          grep -q 'workflow_id' server/src/telemetry/technicalTelemetry.ts
          grep -q '"predev"' package.json
          grep -q 'check:runtime-trace' package.json
          grep -q 'provider.connect.gmail.provider_authenticated' web/consumer-provider-onboarding.js
          grep -q 'uncaught_browser_error' web/runtime-workflow-trace.js
      - name: Parse browser and engineering sources
        run: |
          node --check web/runtime-workflow-trace.js
          node --check web/local-security.js
          node --check web/consumer-provider-onboarding.js
          node --check scripts/engineering/check-runtime-trace-coverage.mjs
          node --check scripts/engineering/generate-runtime-trace-manifest.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Permanent trace coverage
        run: npm run check:runtime-trace
      - name: Complete Flight Recorder contract suite
        run: npx vitest run tests/unit/runtimeWorkflowTraceV2.test.ts tests/unit/runtimeTraceCheckpoint.test.ts tests/unit/runtimeTraceManifest.test.ts tests/unit/workflowDiagnosis.test.ts tests/unit/runtimeTraceCoverage.test.ts tests/unit/runtimeWorkflowTraceBrowserV2.test.ts tests/unit/runtimeWorkflowFeatureCheckpoints.test.ts tests/unit/runtimeTraceRequestContext.test.ts tests/unit/runtimeTraceServerCoverage.test.ts tests/unit/runtimeTraceDiagnosis.test.ts tests/unit/runtimeTraceDiagnosisApi.test.ts tests/unit/runtimeWorkflowTraceTelemetry.test.ts tests/unit/runtimeWorkflowTraceTelemetryV2.test.ts tests/unit/runtimeTraceScaffoldingCleanup.test.ts tests/unit/runtimeProviderOnboardingTrace.test.ts tests/unit/runtimeGmailOAuthTrace.test.ts tests/unit/runtimeBrowserErrorTrace.test.ts
      - name: Exact-build source manifest
        env:
          EMAIL_SHIELD_BUILD_COMMIT: ${{ github.sha }}
        run: node scripts/engineering/generate-runtime-trace-manifest.mjs --output artifacts/engineering/runtime-trace-manifest.json
      - name: Commit clean frozen candidate preparation
        shell: bash
        run: |
          git config user.name "email-shield-engineering"
          git config user.email "email-shield-engineering@users.noreply.github.com"
          git add -A
          git commit -m "chore: freeze clean full-product flight recorder candidate"
          git push origin HEAD:design/full-product-flight-recorder-20260816
