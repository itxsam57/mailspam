name: M2 source snapshot temporary
on:
  push:
    branches:
      - m2-final-closure-audit
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: m2-source-snapshot-${{ github.run_id }}
          path: |
            package.json
            package-lock.json
            server/package.json
            server/tsconfig.json
            server/tsconfig.build.json
            server/vitest.config.ts
            server/src/
            tests/
            web/
            scripts/
            fixtures/
            .engineering/
            docs/
            README.md
            README_REBUILD_STATUS.md
            .github/workflows/verify.yml
          include-hidden-files: true
          retention-days: 7
