name: Provider Onboarding Trace Finalizer

on:
  push:
    branches:
      - design/full-product-flight-recorder-20260816

permissions:
  contents: write

jobs:
  finalize:
    if: "${{ github.event.head_commit.message == 'chore: trigger provider onboarding trace finalizer' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/full-product-flight-recorder-20260816
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add visible provider connection terminal evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('web/consumer-provider-onboarding.js')
          source=path.read_text(encoding='utf-8')
          if 'provider.connect.gmail.ui_confirmed' not in source:
              marker=source.rfind('})();')
              if marker < 0:
                  raise SystemExit('consumer-provider-onboarding IIFE terminator missing')
              addition=r'''

  // Final-testing trace terminal: a provider connection is not considered
  // visibly complete until the consumer account list actually gains an entry.
  // Only the safe provider workflow enum and element counts are observed.
  const traceAccountsList = document.getElementById('accountsList');
  let traceProviderBaseline = null;
  if (traceAccountsList) {
    document.addEventListener('click', (event) => {
      if (event.isTrusted === false) return;
      const workflowId = window.emailShieldRuntimeTrace?.currentWorkflowId?.();
      if (typeof workflowId !== 'string' || !workflowId.startsWith('provider.connect.')) return;
      traceProviderBaseline = traceAccountsList.childElementCount;
    }, true);
    new MutationObserver(() => {
      const trace = window.emailShieldRuntimeTrace;
      const workflowId = trace?.currentWorkflowId?.();
      if (traceProviderBaseline === null || typeof workflowId !== 'string') return;
      if (traceAccountsList.childElementCount <= traceProviderBaseline) return;
      if (workflowId === 'provider.connect.gmail') trace.checkpoint('provider.connect.gmail.ui_confirmed');
      else if (workflowId === 'provider.connect.icloud') trace.checkpoint('provider.connect.icloud.ui_confirmed');
      else if (workflowId === 'provider.connect.yahoo') trace.checkpoint('provider.connect.yahoo.ui_confirmed');
      else if (workflowId === 'provider.connect.imap') trace.checkpoint('provider.connect.imap.ui_confirmed');
      else return;
      traceProviderBaseline = null;
    }).observe(traceAccountsList, { childList: true });
  }
'''
              source=source[:marker]+addition+source[marker:]
              path.write_text(source,encoding='utf-8')
          PY
      - name: Verify provider trace owner
        run: |
          node --check web/consumer-provider-onboarding.js
          npx vitest run tests/unit/runtimeProviderOnboardingTrace.test.ts tests/unit/runtimeWorkflowFeatureCheckpoints.test.ts tests/unit/runtimeWorkflowTraceBrowserV2.test.ts
          npm run typecheck
      - name: Remove this one-shot workflow and trigger, then commit
        shell: bash
        run: |
          git rm -f .github/workflows/provider-onboarding-trace-finalize.yml docs/superpowers/plans/.provider-onboarding-trace-trigger
          git config user.name "email-shield-engineering"
          git config user.email "email-shield-engineering@users.noreply.github.com"
          git add web/consumer-provider-onboarding.js
          git commit -m "feat: confirm provider connection in visible consumer workspace"
          git push origin HEAD:design/full-product-flight-recorder-20260816
