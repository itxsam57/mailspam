name: EMA-20 guarded apply

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - scripts/engineering/ema20-apply.mjs
      - .github/workflows/ema20-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/ema-20-support-bundle-diagnostics-p1-20260820
          fetch-depth: 1

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply guarded EMA-20 production transform
        run: node scripts/engineering/ema20-apply.mjs

      - name: Focused EMA-20 verification
        run: |
          npx vitest run \
            tests/unit/supportBundleDiagnosticFaithfulness.test.ts \
            tests/unit/localOperationalMetrics.test.ts \
            tests/unit/backgroundProtectionCoordinator.test.ts \
            tests/integration/scanWorkerRuntime.test.ts
          npm run typecheck
          npm run build
          git diff --check

      - name: Remove temporary proof automation
        run: |
          rm scripts/engineering/ema20-apply.mjs
          rm .github/workflows/ema20-apply.yml

      - name: Commit verified production repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ema-20): make support diagnostics workflow-faithful"
          git push origin HEAD:repair/ema-20-support-bundle-diagnostics-p1-20260820
