name: EMA-8 Guarded Green

on:
  push:
    branches:
      - repair/ema-8-action-capability-contract-20260818
    paths:
      - .github/workflows/ema8-guarded-green.yml

permissions:
  contents: write

jobs:
  apply-and-prove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/ema-8-action-capability-contract-20260818
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Syntax-check and apply exact root fix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/engineering/apply_ema8_action_capability_fix.py
          python3 scripts/engineering/apply_ema8_action_capability_fix.py
          node --check web/review-actions.js
          node --check web/protection-learning.js
          node --check scripts/engineering/smoke-browser-scan-results.mjs

      - name: Assert production diff allowlist
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            scripts/engineering/smoke-browser-scan-results.mjs
            server/src/api/sessionStore.ts
            web/protection-learning.js
            web/review-actions.js
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            echo "Unexpected EMA-8 production diff" >&2
            exit 1
          fi

      - name: Strict TypeScript typecheck
        run: npm run typecheck -w server

      - name: Full unit and API regressions
        run: npm run test:unit -w server

      - name: Production build
        run: npm run build -w server

      - name: Real Chromium message-action acceptance
        run: node scripts/engineering/smoke-browser-scan-results.mjs

      - name: Commit only proven production owners
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            server/src/api/sessionStore.ts \
            web/review-actions.js \
            web/protection-learning.js \
            scripts/engineering/smoke-browser-scan-results.mjs
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            scripts/engineering/smoke-browser-scan-results.mjs \
            server/src/api/sessionStore.ts \
            web/protection-learning.js \
            web/review-actions.js | sort)"
          test "$staged" = "$expected"
          git commit -m "fix: reconcile mutually exclusive message actions"
          git push origin HEAD:repair/ema-8-action-capability-contract-20260818
