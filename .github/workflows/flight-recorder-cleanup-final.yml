name: Flight Recorder Final Scaffolding Sweep

on:
  push:
    branches:
      - design/full-product-flight-recorder-20260816

permissions:
  contents: write

jobs:
  cleanup:
    if: "${{ github.event.head_commit.message == 'chore: trigger final flight recorder scaffolding sweep' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/full-product-flight-recorder-20260816
          fetch-depth: 0
      - name: Remove every one-shot flight recorder construction artifact
        shell: bash
        run: |
          find .github/workflows -maxdepth 1 -type f -name 'flight-recorder-*.yml' -print0 | xargs -0 -r git rm -f --ignore-unmatch
          find scripts/engineering -maxdepth 1 -type f \( -name 'apply-flight-recorder-*' -o -name 'reconcile-flight-recorder-*' \) -print0 | xargs -0 -r git rm -f --ignore-unmatch
          find docs/superpowers/plans -maxdepth 1 -type f \( -name '.flight-recorder-*' -o -name '.keep-flight-recorder-red*' \) -print0 | xargs -0 -r git rm -f --ignore-unmatch
      - name: Prove release hygiene before commit
        shell: bash
        run: |
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'flight-recorder-*.yml' -print -quit)"
          test -z "$(find scripts/engineering -maxdepth 1 -type f \( -name 'apply-flight-recorder-*' -o -name 'reconcile-flight-recorder-*' \) -print -quit)"
          test -z "$(find docs/superpowers/plans -maxdepth 1 -type f \( -name '.flight-recorder-*' -o -name '.keep-flight-recorder-red*' \) -print -quit)"
      - name: Commit clean release head
        shell: bash
        run: |
          git config user.name "email-shield-engineering"
          git config user.email "email-shield-engineering@users.noreply.github.com"
          git commit -m "chore: finalize clean flight recorder release head"
          git push origin HEAD:design/full-product-flight-recorder-20260816
