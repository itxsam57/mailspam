name: M2 closure audit temporary
on:
  push:
    branches:
      - m2-final-closure-audit
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate closure audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/closure-audit
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          roots = [Path('server/src'), Path('web'), Path('scripts')]
          source_files = []
          for root in roots:
              if root.exists():
                  source_files += [p for p in root.rglob('*') if p.is_file() and p.suffix in {'.ts','.js','.mjs','.cjs'}]
          test_files = [p for p in Path('tests').rglob('*') if p.is_file() and p.suffix in {'.ts','.js','.mjs','.cjs'}]
          all_files = source_files + test_files

          def hits(pattern, files=source_files, flags=re.I):
              rx = re.compile(pattern, flags)
              out=[]
              for p in files:
                  try: text=p.read_text(errors='replace')
                  except Exception: continue
                  for i,line in enumerate(text.splitlines(),1):
                      if rx.search(line): out.append(f'{p}:{i}:{line.strip()}')
              return out

          report=[]
          report.append(f'SOURCE_FILES={len(source_files)} TEST_FILES={len(test_files)}')
          checks = {
              'TODO_FIXME_HACK_XXX': r'\b(TODO|FIXME|HACK|XXX|NOT[ _-]?IMPLEMENTED)\b',
              'TS_SUPPRESSIONS': r'@ts-(ignore|nocheck|expect-error)',
              'LINT_SUPPRESSIONS': r'eslint-disable|biome-ignore',
              'EVAL_DYNAMIC_CODE': r'\beval\s*\(|new\s+Function\s*\(',
              'SHELL_TRUE': r'shell\s*:\s*true',
              'CHILD_PROCESS': r'node:child_process|child_process|\bexec(File|Sync)?\s*\(|\bspawn(Sync)?\s*\(',
              'PROCESS_ENV': r'process\.env(?:\.|\[)',
              'GLOBAL_FETCH': r'(?<![A-Za-z0-9_])fetch\s*\(',
              'HTTP_REQUEST': r'(?:http|https)\.request\s*\(|\brequest\s*\(',
              'FS_READS': r'\b(readFileSync|readFile|createReadStream|openSync|open)\s*\(',
              'FS_WRITES': r'\b(writeFileSync|writeFile|appendFileSync|appendFile|createWriteStream|renameSync|rename)\s*\(',
              'JSON_PARSE': r'JSON\.parse\s*\(',
              'LOOSE_ANY': r'\bas\s+any\b|:\s*any\b|<any>',
              'PROVIDER_BRANCHES': r'provider\s*(===|!==|==|!=)|switch\s*\([^\n]*provider',
              'LOCAL_STORAGE': r'localStorage|sessionStorage',
              'SECRET_WORDS': r'clientSecret|client_secret|refreshToken|refresh_token|appPassword|password',
          }
          for name,pat in checks.items():
              hs=hits(pat)
              report.append(f'\n## {name} ({len(hs)})')
              report.extend(hs[:500])

          # Express route inventory.
          routes = hits(r'\b(?:app|router)\.(get|post|put|patch|delete|use)\s*\(')
          report.append(f'\n## EXPRESS_ROUTES ({len(routes)})')
          report.extend(routes)

          # Browser endpoint inventory.
          browser_files=[p for p in source_files if str(p).startswith('web/')]
          browser_calls=hits(r'fetch\s*\(|EventSource\s*\(', browser_files)
          report.append(f'\n## BROWSER_NETWORK_CALLS ({len(browser_calls)})')
          report.extend(browser_calls)

          # Canonical envelope field occurrence counts in production source only.
          envelope=Path('server/src/canonical/envelope.ts').read_text(errors='replace')
          fields=[]
          for m in re.finditer(r'^\s{2}([A-Za-z][A-Za-z0-9]*)\??:\s', envelope, re.M):
              name=m.group(1)
              if name not in fields: fields.append(name)
          prod_text='\n'.join(p.read_text(errors='replace') for p in source_files if str(p).startswith('server/src/'))
          counts={name:len(re.findall(r'\b'+re.escape(name)+r'\b', prod_text)) for name in fields}
          report.append('\n## CANONICAL_FIELD_COUNTS')
          for name,count in sorted(counts.items(), key=lambda kv:(kv[1],kv[0])):
              report.append(f'{name}={count}')

          # Production TypeScript files with no direct test filename correlation (heuristic only).
          prod_ts=[p for p in Path('server/src').rglob('*.ts')]
          test_text='\n'.join(p.read_text(errors='replace') for p in test_files)
          report.append('\n## LOW_DIRECT_TEST_REFERENCE_PRODUCTION_FILES')
          for p in prod_ts:
              stem=p.stem
              if stem in {'index','types'}: continue
              if stem.lower() not in test_text.lower():
                  report.append(str(p))

          Path('artifacts/closure-audit/static-audit.txt').write_text('\n'.join(report)+'\n')

          # Repository inventory for independent review.
          inv=[]
          for p in sorted(Path('.').rglob('*')):
              if p.is_file() and '.git/' not in str(p) and 'node_modules/' not in str(p) and 'artifacts/' not in str(p):
                  inv.append(str(p))
          Path('artifacts/closure-audit/repository-files.txt').write_text('\n'.join(inv)+'\n')
          PY
          npm audit --json > artifacts/closure-audit/npm-audit-all.json || true
          npm audit --omit=dev --json > artifacts/closure-audit/npm-audit-prod.json || true
          npm run gate > artifacts/closure-audit/full-gate.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-closure-audit-${{ github.run_id }}
          path: artifacts/closure-audit/
          retention-days: 7
