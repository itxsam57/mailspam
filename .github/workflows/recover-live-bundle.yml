name: Recover verified live-test bundle

on:
  push:
    branches:
      - recovery/import-live-test-bundle-v2-2026-08-11
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery transport
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reconstruct and verify exact Git bundle
        shell: bash
        run: |
          set -euo pipefail
          check_prefix() {
            expected="$1"
            bytes="$2"
            actual="$(sha256sum /tmp/recovery.b64 | awk '{print $1}')"
            echo "prefix ${bytes}: ${actual}"
            test "$(wc -c </tmp/recovery.b64)" = "$bytes"
            test "$actual" = "$expected"
          }

          cat \
            .recovery/live-test-bundle-v2/part-00 \
            .recovery/live-test-bundle-v2/part-01 \
            .recovery/live-test-bundle-v2/part-02 \
            .recovery/live-test-bundle-v2/part-03 \
            > /tmp/recovery.b64
          check_prefix ecfbbdb66d3facea05956be225f44339e6c5bffae0ca1e000a512034785a543f 72000

          cat .recovery/live-test-bundle-v2/tail-00 >> /tmp/recovery.b64
