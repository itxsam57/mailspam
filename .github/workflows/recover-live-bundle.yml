          check_prefix cbac2b52a46b0b2e7e103e5803d22fc00a52ac629b7012ed48ff0a5c498f4c35 274000
          cat .recovery/live-test-bundle-v2/tail-274000-276000 >> /tmp/recovery.b64
          check_prefix 16f4a3534043a358ea80ef994b59f9e587e184c1cdd776990a693457f3d36d24 276000
          cat .recovery/live-test-bundle-v2/tail-276000-278000 >> /tmp/recovery.b64
          check_prefix 76ba55ef54e7042aa9229392e0102dc309e9c8c3044cdf466968512ce80276c9 278000
          cat .recovery/live-test-bundle-v2/tail-278000-279228 >> /tmp/recovery.b64
          check_prefix 1cb57e790e167aac293b7f392c319584c3cd14a7877a89a4689f194ae8229a08 279228

          base64 -d /tmp/recovery.b64 > /tmp/recovery.bundle
          test "$(wc -c </tmp/recovery.bundle)" = "209421"
          echo "9410f374098541e3b19defdd9ec8bebe5669ca5c154f479afb0f12cef348a7cb  /tmp/recovery.bundle" | sha256sum -c -
          git bundle verify /tmp/recovery.bundle
          git fetch /tmp/recovery.bundle HEAD:refs/heads/recovered-live-bundle
          test "$(git rev-parse recovered-live-bundle)" = "6f520ff5ece2c62b767fc7a28e65dddebcbe5297"
          test "$(git rev-parse recovered-live-bundle^{tree})" = "e7f09d6ce9fb5d01c2491e20afc379c2f1b6b63f"
          test "$(git merge-base recovered-live-bundle 35e1896c40fbae00a7aa3d2272096944fc9092a5)" = "35e1896c40fbae00a7aa3d2272096944fc9092a5"
          test "$(git rev-list --count 35e1896c40fbae00a7aa3d2272096944fc9092a5..recovered-live-bundle)" = "13"
          git fsck --strict
