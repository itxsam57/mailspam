name: Flight Recorder Scaffolding Cleanup

on:
  push:
    branches:
      - design/full-product-flight-recorder-20260816

permissions:
  contents: write

jobs:
  cleanup:
    if: "${{ github.event.head_commit.message == 'chore: trigger flight recorder scaffolding cleanup' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/full-product-flight-recorder-20260816
          fetch-depth: 0
      - name: Remove temporary implementation scaffolding
        shell: bash
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/flight-recorder-codemod.yml \
            .github/workflows/flight-recorder-registry.yml \
            .github/workflows/flight-recorder-focused.yml \
            .github/workflows/flight-recorder-task5.yml \
            .github/workflows/flight-recorder-task5-verify.yml \
            .github/workflows/flight-recorder-deep-server.yml \
            .github/workflows/flight-recorder-automatic-roots.yml \
            .github/workflows/flight-recorder-diagnosis-routes.yml \
            .github/workflows/flight-recorder-build-gate.yml \
            .github/workflows/flight-recorder-telemetry-v2.yml \
            .github/workflows/flight-recorder-precleanup-audit.yml \
            .github/workflows/flight-recorder-cleanup.yml \
            scripts/engineering/apply-flight-recorder-codemods.mjs \
            scripts/engineering/apply-flight-recorder-exact-edits.py \
            scripts/engineering/apply-flight-recorder-change-controls.py \
            scripts/engineering/reconcile-flight-recorder-registry.py \
            scripts/engineering/apply-flight-recorder-task5.py \
            scripts/engineering/apply-flight-recorder-deep-server.py \
            scripts/engineering/apply-flight-recorder-automatic-roots.py \
            scripts/engineering/apply-flight-recorder-diagnosis-routes.py \
            scripts/engineering/apply-flight-recorder-build-gate.py \
            scripts/engineering/apply-flight-recorder-telemetry-v2.py \
            docs/superpowers/plans/.flight-recorder-codemod-trigger \
            docs/superpowers/plans/.flight-recorder-registry-trigger \
            docs/superpowers/plans/.flight-recorder-task5-trigger \
            docs/superpowers/plans/.flight-recorder-task5-verify-trigger \
            docs/superpowers/plans/.flight-recorder-task5-green \
            docs/superpowers/plans/.flight-recorder-deep-server-trigger \
            docs/superpowers/plans/.flight-recorder-automatic-roots-trigger \
            docs/superpowers/plans/.flight-recorder-diagnosis-routes-trigger \
            docs/superpowers/plans/.flight-recorder-build-gate-trigger \
            docs/superpowers/plans/.flight-recorder-telemetry-v2-trigger \
            docs/superpowers/plans/.flight-recorder-precleanup-audit.yml \
            docs/superpowers/plans/.flight-recorder-precleanup-trigger \
            docs/superpowers/plans/.flight-recorder-precleanup-green \
            docs/superpowers/plans/.flight-recorder-cleanup-trigger \
            docs/superpowers/plans/.keep-flight-recorder-red \
            docs/superpowers/plans/.keep-flight-recorder-red-2 \
            docs/superpowers/plans/.keep-flight-recorder-red-3 \
            docs/superpowers/plans/.keep-flight-recorder-red-4 \
            docs/superpowers/plans/.keep-flight-recorder-red-5
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "email-shield-engineering"
          git config user.email "email-shield-engineering@users.noreply.github.com"
          git commit -m "chore: remove flight recorder implementation scaffolding"
          git push origin HEAD:design/full-product-flight-recorder-20260816
