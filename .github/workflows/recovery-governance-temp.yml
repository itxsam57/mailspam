name: Temporary recovery governance

on:
  push:
    branches: [m2-community-recovery-rotation]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2-community-recovery-rotation
      - name: Stop after governance commit
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[recovery-governance\]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply governance
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/apply-recovery-governance-temp.mjs
      - name: Commit governance
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .engineering/TEST_MATRIX.md .engineering/REGRESSION_REGISTER.md README_REBUILD_STATUS.md
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Lock community recovery governance [recovery-governance]"
          git push origin HEAD:m2-community-recovery-rotation
