name: One-shot retained-evidence reputation repair

on:
  push:
    branches: [fix/final-release-hardening]
    paths: [.github/workflows/reputation-root-fix.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-release-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply audited retained-evidence patch
        run: git apply --check .engineering/reputation-root-fix.patch && git apply .engineering/reputation-root-fix.patch

      - name: Install and certify focused root repair
        run: |
          npm ci
          npm run typecheck
          npx vitest run tests/unit/globalThreatConfidence.test.ts

      - name: Commit root repair and remove one-shot engineering files
        shell: bash
        run: |
          rm .github/workflows/reputation-root-fix.yml .engineering/reputation-root-fix.patch
          git config user.name "email-shield-engineering"
          git config user.email "engineering@email-shield.local"
          git add server/src/community/aggregateStore.ts tests/unit/globalThreatConfidence.test.ts .github/workflows/reputation-root-fix.yml .engineering/reputation-root-fix.patch
          git commit -m "Fix Global Shield reputation retention at reviewed-evidence boundary"
          git push origin HEAD:fix/final-release-hardening
