name: One-shot retained-evidence reputation repair

on:
  push:
    branches: [fix/final-release-hardening]
    paths: [.github/workflows/reputation-root-fix.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-release-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply retained-evidence reputation repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          store_path = Path('server/src/community/aggregateStore.ts')
          text = store_path.read_text()

          anchor = '''function pruneExpired(database: StoredCommunityDatabase, nowMs: number): boolean {'''
          helper = '''function deriveReporterReputation(database: StoredCommunityDatabase): StoredCommunityDatabase["reporterReputation"] {
            const derived: StoredCommunityDatabase["reporterReputation"] = {};
            for (const campaign of Object.values(database.campaigns)) {
              const review = campaign.review;
              if (!review || (review.status !== "approved" && review.status !== "rejected") || !review.resolvedAt) continue;
              const resolvedAt = Date.parse(review.resolvedAt);
              for (const [proof, reporter] of Object.entries(campaign.reporters)) {
                // Reputation may only be learned from evidence that actually
                // existed when the human decision was made. A later update or
                // newly arriving reporter is not retroactively covered by it.
                if (Date.parse(reporter.reportedAt) > resolvedAt) continue;
                const prior = derived[proof] ?? { resolvedCases: 0, alignedCases: 0 };
                const threatReporter = !isLegitimate(reporter);
                const aligned = review.status === "approved" ? threatReporter : !threatReporter;
                derived[proof] = {
                  resolvedCases: prior.resolvedCases + 1,
                  alignedCases: prior.alignedCases + (aligned ? 1 : 0),
                };
              }
            }
            return derived;
          }

          function reconcileReporterReputation(database: StoredCommunityDatabase): boolean {
            const derived = deriveReporterReputation(database);
            const currentProofs = Object.keys(database.reporterReputation);
            const derivedProofs = Object.keys(derived);
            const changed = currentProofs.length !== derivedProofs.length || derivedProofs.some((proof) => {
              const current = database.reporterReputation[proof];
              const next = derived[proof]!;
              return !current || current.resolvedCases !== next.resolvedCases || current.alignedCases !== next.alignedCases;
            });
            if (changed) database.reporterReputation = derived;
            return changed;
          }

          function pruneExpired(database: StoredCommunityDatabase, nowMs: number): boolean {'''
          if text.count(anchor) != 1:
              raise SystemExit('prune anchor count mismatch')
          text = text.replace(anchor, helper, 1)

          old_prune = '''  // Reporter history is confidence metadata derived from retained evidence.
            // Once no retained campaign references a proof, keeping reputation would be
            // both unbounded state growth and unnecessary long-lived pseudonymous data.
            const retainedProofs = new Set<string>();
            for (const campaign of Object.values(database.campaigns)) {
              for (const proof of Object.keys(campaign.reporters)) retainedProofs.add(proof);
            }
            for (const proof of Object.keys(database.reporterReputation)) {
              if (retainedProofs.has(proof)) continue;
              delete database.reporterReputation[proof];
              changed = true;
            }
            return changed;'''
          new_prune = '''  // Reporter confidence is a derived cache of still-retained,
            // resolved review evidence. Re-derive after pruning so expired reviews,
            // reopened campaigns and post-review reporter updates cannot survive as
            // long-lived pseudonymous reputation.
            if (reconcileReporterReputation(database)) changed = true;
            return changed;'''
          if text.count(old_prune) != 1:
              raise SystemExit('old prune block count mismatch')
          text = text.replace(old_prune, new_prune, 1)

          old_accept = '''    applyReportToDatabase(database, report, acceptedAt);
            database.campaigns[report.campaignFingerprint]!.review = nextReview;
            this.databaseCache = database;
            this.snapshotPlaintextBytes = candidatePlaintextBytes;
            this.campaignMetrics.set(report.campaignFingerprint, nextMetrics);
            const nextLegitimate = previousLegitimate - (priorReporter && isLegitimate(priorReporter) ? 1 : 0) + (isLegitimate(candidateReporter) ? 1 : 0);
            const nextPositiveConsensus = nextLegitimate >= LEGITIMATE_CONSENSUS_REPORTERS && nextMetrics.reporters === 0;'''
          new_accept = '''    applyReportToDatabase(database, report, acceptedAt);
            const updatedCampaign = database.campaigns[report.campaignFingerprint]!;
            updatedCampaign.review = nextReview;
            const reputationChanged = reconcileReporterReputation(database);
            const effectiveMetrics = metricsFor(updatedCampaign, database.reporterReputation);
            this.databaseCache = database;
            this.snapshotPlaintextBytes = reputationChanged
              ? Buffer.byteLength(JSON.stringify(database), "utf8")
              : candidatePlaintextBytes;
            if (reputationChanged) this.rebuildIndexes(database);
            else this.campaignMetrics.set(report.campaignFingerprint, effectiveMetrics);
            const nextLegitimate = previousLegitimate - (priorReporter && isLegitimate(priorReporter) ? 1 : 0) + (isLegitimate(candidateReporter) ? 1 : 0);
            const nextPositiveConsensus = nextLegitimate >= LEGITIMATE_CONSENSUS_REPORTERS && effectiveMetrics.reporters === 0;'''
          if text.count(old_accept) != 1:
              raise SystemExit('accept block count mismatch')
          text = text.replace(old_accept, new_accept, 1)

          old_receipt = '''      independentReporters: isLegitimate(candidateReporter) ? nextLegitimate : nextMetrics.reporters,
                status,
                feedUpdated: status !== previousStatus || previousPositiveConsensus !== nextPositiveConsensus,'''
          new_receipt = '''      independentReporters: isLegitimate(candidateReporter) ? nextLegitimate : effectiveMetrics.reporters,
                status,
                feedUpdated: reputationChanged || status !== previousStatus || previousPositiveConsensus !== nextPositiveConsensus,'''
          if text.count(old_receipt) != 1:
              raise SystemExit('receipt block count mismatch')
          text = text.replace(old_receipt, new_receipt, 1)

          old_resolve = '''    const previousReview = structuredClone(campaign.review);
            const previousReputation = new Map<string, StoredCommunityReporterReputation | undefined>();
            const resolvedAt = now.toISOString();
            campaign.review = {
              status: input.decision,
              createdAt: previousReview.createdAt,
              resolvedAt,
              reviewerId: input.reviewerId,
              reason,
            };
            for (const [proof, reporter] of Object.entries(campaign.reporters)) {
              previousReputation.set(proof, database.reporterReputation[proof] ? { ...database.reporterReputation[proof]! } : undefined);
              const prior = database.reporterReputation[proof] ?? { resolvedCases: 0, alignedCases: 0 };
              const threatReporter = !isLegitimate(reporter);
              const aligned = input.decision === "approved" ? threatReporter : !threatReporter;
              database.reporterReputation[proof] = {
                resolvedCases: prior.resolvedCases + 1,
                alignedCases: prior.alignedCases + (aligned ? 1 : 0),
              };
            }

            try {
              this.assertSnapshotCapacity(database);
              this.compact(database);
              this.rebuildIndexes(database);
            } catch (error) {
              campaign.review = previousReview;
              for (const [proof, prior] of previousReputation) {
                if (prior) database.reporterReputation[proof] = prior;
                else delete database.reporterReputation[proof];
              }
              this.rebuildIndexes(database);
              throw error;
            }

            return {
              campaignFingerprint: input.campaignFingerprint,
              decision: input.decision,
              resolvedAt,
              reporterHistoriesUpdated: previousReputation.size,
            };'''
          new_resolve = '''    const previousReview = structuredClone(campaign.review);
            const previousReputation = structuredClone(database.reporterReputation);
            const resolvedAt = now.toISOString();
            campaign.review = {
              status: input.decision,
              createdAt: previousReview.createdAt,
              resolvedAt,
              reviewerId: input.reviewerId,
              reason,
            };
            reconcileReporterReputation(database);
            const reporterHistoriesUpdated = Object.values(campaign.reporters)
              .filter((reporter) => Date.parse(reporter.reportedAt) <= Date.parse(resolvedAt)).length;

            try {
              this.assertSnapshotCapacity(database);
              this.compact(database);
              this.rebuildIndexes(database);
            } catch (error) {
              campaign.review = previousReview;
              database.reporterReputation = previousReputation;
              this.rebuildIndexes(database);
              throw error;
            }

            return {
              campaignFingerprint: input.campaignFingerprint,
              decision: input.decision,
              resolvedAt,
              reporterHistoriesUpdated,
            };'''
          if text.count(old_resolve) != 1:
              raise SystemExit('resolve block count mismatch')
          text = text.replace(old_resolve, new_resolve, 1)

          store_path.write_text(text)

          test_path = Path('tests/unit/globalThreatConfidence.test.ts')
          tests = test_path.read_text()
          close = '\n});\n'
          if not tests.endswith(close):
              raise SystemExit('confidence suite closing anchor mismatch')
          addition = r'''

            it("forgets expired reviewed reputation even while the reporter remains active in retained evidence", () => {
              const { aggregate, setNow } = harness();
              const reporters = ["retained-0", "retained-1", "retained-2", "retained-3", "retained-4"];

              for (let caseIndex = 0; caseIndex < 3; caseIndex++) {
                const campaign = String(caseIndex + 2).repeat(64);
                const baseDay = 10 + (caseIndex * 2);
                const times = [
                  `2026-08-${baseDay}T00:00:00.000Z`,
                  `2026-08-${baseDay}T01:00:00.000Z`,
                  `2026-08-${baseDay}T02:00:00.000Z`,
                  `2026-08-${baseDay}T03:00:00.000Z`,
                  `2026-08-${baseDay + 1}T07:00:00.000Z`,
                ];
                for (let index = 0; index < reporters.length; index++) {
                  setNow(times[index]!);
                  aggregate.accept(report(reporters[index]!, new Date(times[index]!), campaign));
                }
                aggregate.resolveReviewCandidate({
                  campaignFingerprint: campaign,
                  decision: "rejected",
                  reviewerId: "reviewer-retention",
                  reason: "Controlled rejected case used to certify reputation retention boundaries.",
                });
              }

              // Keep every proof actively retained after the old reviewed cases,
              // without creating another resolved review outcome.
              const anchor = "8".repeat(64);
              for (const [index, reporterId] of reporters.entries()) {
                const value = `2026-10-30T0${index}:00:00.000Z`;
                setNow(value);
                aggregate.accept(report(reporterId, new Date(value), anchor));
              }

              // The August review evidence is now outside the 90-day retention
              // window, but the proofs themselves remain present in the October
              // anchor. Historical rejected cases must no longer depress them.
              const fresh = "7".repeat(64);
              for (const [index, value] of [
                "2026-11-15T00:00:00.000Z",
                "2026-11-15T01:00:00.000Z",
                "2026-11-15T02:00:00.000Z",
                "2026-11-15T03:00:00.000Z",
                "2026-11-16T07:00:00.000Z",
              ].entries()) {
                setNow(value);
                aggregate.accept(report(reporters[index]!, new Date(value), fresh));
              }

              expect(aggregate.listReviewCandidates()).toContainEqual(expect.objectContaining({
                campaignFingerprint: fresh,
                independentReporters: 5,
                strongReporters: 5,
              }));
            });

            it("does not retroactively apply a resolved review to a reporter that arrives afterward", () => {
              const { aggregate, setNow, now } = harness();
              const campaign = "6".repeat(64);
              submitSpreadReports(aggregate, setNow, campaign);
              aggregate.resolveReviewCandidate({
                campaignFingerprint: campaign,
                decision: "approved",
                reviewerId: "reviewer-retroactive",
                reason: "Controlled approved case used to certify review-time evidence ownership.",
              });

              setNow("2026-08-12T09:00:00.000Z");
              aggregate.accept(report("late-reporter", now(), campaign));

              // A reporter arriving after the human decision cannot inherit that
              // approval as a reputation case. Three later rejected reviews for
              // that reporter must therefore be sufficient to establish the
              // expected poor-history multiplier from exactly those three cases.
              for (let caseIndex = 0; caseIndex < 3; caseIndex++) {
                const rejected = ["a", "b", "c"][caseIndex]!.repeat(64);
                const cohort = ["late-reporter", `late-peer-${caseIndex}-1`, `late-peer-${caseIndex}-2`, `late-peer-${caseIndex}-3`, `late-peer-${caseIndex}-4`];
                const first = 13 + (caseIndex * 2);
                const times = [
                  `2026-08-${first}T00:00:00.000Z`,
                  `2026-08-${first}T01:00:00.000Z`,
                  `2026-08-${first}T02:00:00.000Z`,
                  `2026-08-${first}T03:00:00.000Z`,
                  `2026-08-${first + 1}T07:00:00.000Z`,
                ];
                for (let index = 0; index < cohort.length; index++) {
                  setNow(times[index]!);
                  aggregate.accept(report(cohort[index]!, new Date(times[index]!), rejected));
                }
                aggregate.resolveReviewCandidate({
                  campaignFingerprint: rejected,
                  decision: "rejected",
                  reviewerId: "reviewer-retroactive",
                  reason: "Controlled reputation history after late arrival.",
                });
              }

              const probe = "d".repeat(64);
              const probeCohort = ["late-reporter", "probe-1", "probe-2", "probe-3", "probe-4"];
              for (const [index, value] of [
                "2026-08-20T00:00:00.000Z",
                "2026-08-20T01:00:00.000Z",
                "2026-08-20T02:00:00.000Z",
                "2026-08-20T03:00:00.000Z",
                "2026-08-21T07:00:00.000Z",
              ].entries()) {
                setNow(value);
                aggregate.accept(report(probeCohort[index]!, new Date(value), probe));
              }
              expect(aggregate.listReviewCandidates().some((candidate) => candidate.campaignFingerprint === probe)).toBe(false);
            });
          '''
          tests = tests[:-len(close)] + addition + close
          test_path.write_text(tests)
          PY

      - name: Install and certify focused root repair
        run: |
          npm ci
          npm run typecheck
          npx vitest run tests/unit/globalThreatConfidence.test.ts

      - name: Commit root repair and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/reputation-root-fix.yml
          git config user.name "email-shield-engineering"
          git config user.email "engineering@email-shield.local"
          git add server/src/community/aggregateStore.ts tests/unit/globalThreatConfidence.test.ts .github/workflows/reputation-root-fix.yml
          git commit -m "Fix Global Shield reputation retention at reviewed-evidence boundary"
          git push origin HEAD:fix/final-release-hardening
