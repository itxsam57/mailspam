name: Apply Windows root fix

on:
  push:
    branches:
      - diagnostic/windows-recovered-gate

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/windows-recovered-gate
          fetch-depth: 0

      - name: Apply proven journal truncate fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          store = Path('server/src/community/aggregateStore.ts')
          text = store.read_text(encoding='utf-8')
          old_open = '      const descriptor = openSync(this.journalPath, fsConstants.O_WRONLY | fsConstants.O_TRUNC | noFollow);'
          new_open = '      const descriptor = openSync(this.journalPath, fsConstants.O_WRONLY | noFollow);'
          stat_line = '        if (!fstatSync(descriptor).isFile()) throw new Error("Community report journal is not a regular file.");'
          if text.count(old_open) != 1:
              raise SystemExit(f'Expected one compact O_TRUNC open, found {text.count(old_open)}.')
          if text.count(stat_line) != 1:
              raise SystemExit(f'Expected one compact regular-file check, found {text.count(stat_line)}.')
          text = text.replace(old_open, new_open, 1)
          text = text.replace(stat_line, stat_line + '\n        ftruncateSync(descriptor, 0);', 1)
          store.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff --check
          git diff -- server/src/community/aggregateStore.ts

      - name: Commit proven root fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "itxsam57"
          git config user.email "143406136+itxsam57@users.noreply.github.com"
          git add server/src/community/aggregateStore.ts
          git commit -m "Fix Windows community journal compaction"
          git push origin HEAD:refs/heads/fix/windows-recovered-gate
