name: Temporary canonical-session Task 3 GREEN

on:
  push:
    branches:
      - repair/canonical-session-reachability-p0-20260817

permissions:
  contents: write

jobs:
  apply_verify_commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/canonical-session-reachability-p0-20260817
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply guarded production transformation
        run: node scripts/engineering/apply-canonical-task3-green.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Prove GREEN
        run: |
          npm run typecheck
          npm run test:unit

      - name: Commit only production owners
        run: |
          git add server/src/api/backgroundProtection.ts server/src/realtime/realtimeProtectionProcessor.ts
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "2"
          git diff --cached --name-only | grep -Fx 'server/src/api/backgroundProtection.ts'
          git diff --cached --name-only | grep -Fx 'server/src/realtime/realtimeProtectionProcessor.ts'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: route protection through canonical mailbox owner'
          git push origin HEAD:repair/canonical-session-reachability-p0-20260817
