name: Apply Approved Scan Ownership Fix

on:
  push:
    branches: [qa/governor-executable-browser-final]
    paths:
      - scripts/engineering/apply-approved-scan-ownership-fix.mjs
      - .github/workflows/apply-approved-scan-ownership-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact helper commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert exact helper commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Apply approved bounded production patch
        shell: bash
        run: |
          set -euo pipefail
          node scripts/engineering/apply-approved-scan-ownership-fix.mjs
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'web/scan-live-reattach.js\nweb/scan-monitor.js'
          test "$changed" = "$expected" || {
            echo "Unexpected changed files:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }

      - name: Commit only approved production files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/scan-monitor.js web/scan-live-reattach.js
          git commit -m "fix: enforce single live scan presentation owner"
          git push origin HEAD:qa/governor-executable-browser-final
