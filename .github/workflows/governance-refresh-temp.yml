name: Temporary community feed governance refresh

on:
  push:
    branches: [m2-bounded-community-feed]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[governance-refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2-bounded-community-feed
      - name: Apply deterministic governance entries
        shell: python
        run: |
          from pathlib import Path

          matrix = Path('.engineering/TEST_MATRIX.md')
          text = matrix.read_text(encoding='utf-8')
          if '| A-49 |' not in text:
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('| A-48 | PSL-backed registrable-domain boundary |'):
                      lines.insert(i + 1, '| A-49 | Bounded signed community-feed resources | Remote report receipts are capped at 32 KiB and signed feed/cache documents at 4 MiB using streamed byte accounting before JSON parsing; v1 signed feeds are schema/entry/string/fan-out bounded before detector use; Ed25519 signatures must decode canonically to exactly 64 bytes; oversized/invalid feeds become unavailable rather than clean or truncated; a still-fresh verified cache may survive a bad refresh; durable report acceptance is not reversed by later feed-capacity publication failure; no provider/mailbox permission or public-deployment claim is added | `communityFeedBounds.test.ts`, `communityFeedCapacitySemantics.test.ts`, community signing/network/API/architecture regressions, strict type/build, full corpus/Worker/server/browser gate | Windows + macOS + Ubuntu | Blocking |')
                      break
              else:
                  raise SystemExit('A-48 insertion point not found')
              text = '\n'.join(lines) + '\n'
          old = 'PSL-backed registrable-domain boundary behavior, and Analyze Links DNS-pinning/SSRF/redirect/resource-boundary behavior are automated.'
          new = 'PSL-backed registrable-domain boundary behavior, bounded signed community-feed acquisition/validation behavior, and Analyze Links DNS-pinning/SSRF/redirect/resource-boundary behavior are automated.'
          if old in text:
              text = text.replace(old, new, 1)
          matrix.write_text(text, encoding='utf-8')

          register = Path('.engineering/REGRESSION_REGISTER.md')
          text = register.read_text(encoding='utf-8')
          if '| REG-059 |' not in text:
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('| REG-058 |'):
                      lines.insert(i + 1, '| REG-059 | LOCKED | Community network acquisition and signed-feed consumption must remain resource bounded before detector use. Remote receipts are limited to 32 KiB and feed/cache documents to 4 MiB with both declared-length and streamed-byte enforcement; version-1 feed entries, values, rule IDs and identity alias/domain fan-out are bounded and unknown fields rejected; Ed25519 signatures must be canonical 64-byte values; oversized/invalid feeds are unavailable, never clean or silently truncated; only an independently still-valid cached feed may be retained; a durably accepted report must not be falsely rejected/requeued solely because publication subsequently reaches the feed resource ceiling. | `communityFeedBounds.test.ts`, `communityFeedCapacitySemantics.test.ts`, community signing/network/API/architecture regressions, strict type/build, full corpus/Worker/server/browser gate |')
                      break
              else:
                  raise SystemExit('REG-058 insertion point not found')
              text = '\n'.join(lines) + '\n'
          if '| GAP-018 |' not in text:
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('| GAP-017 |'):
                      lines.insert(i + 1, '| GAP-018 | RESOLVED | Bounded community-feed acquisition and signed-document validation | The remote client formerly parsed community JSON without a response-byte ceiling and verified signed feeds without a bounded v1 entry schema, so a compromised/misconfigured endpoint or pathological signed document could consume excessive memory/CPU before or after signature validation. Added streamed 32 KiB receipt / 4 MiB feed limits, bounded cache reads, strict signed-entry/fan-out/signature validation, signer-side document limits, verified-cache failover, and capacity-safe report acceptance semantics. GAP-004 public deployment/ops and GAP-008 gateway reputation/volumetric defence remain open and are not claimed by this resolution. |')
                      break
              else:
                  raise SystemExit('GAP-017 insertion point not found')
              text = '\n'.join(lines) + '\n'
          register.write_text(text, encoding='utf-8')

          readme = Path('README_REBUILD_STATUS.md')
          text = readme.read_text(encoding='utf-8')
          if 'bounded signed community-feed acquisition' not in text:
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('- Public Suffix List-backed registrable-domain boundary'):
                      if line.endswith('.'):
                          lines[i] = line[:-1] + ';'
                      lines.insert(i + 1, '- bounded signed community-feed acquisition and validation: streamed 32 KiB receipt / 4 MiB feed ceilings, strict v1 entry and identity fan-out bounds, exact Ed25519 signature encoding, verified-cache failover, and capacity-safe accepted-report semantics without claiming public deployment or gateway abuse controls.')
                      break
              else:
                  raise SystemExit('README insertion point not found')
              text = '\n'.join(lines) + '\n'
          readme.write_text(text, encoding='utf-8')
      - name: Commit governance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .engineering/TEST_MATRIX.md .engineering/REGRESSION_REGISTER.md README_REBUILD_STATUS.md
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Lock community feed resource governance [governance-refresh]"
          git push origin HEAD:m2-bounded-community-feed
