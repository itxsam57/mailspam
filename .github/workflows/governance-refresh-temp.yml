name: Temporary governance refresh

on:
  push:
    branches: [m2-public-suffix-domain-boundary]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[governance-refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2-public-suffix-domain-boundary
      - name: Apply deterministic governance entries
        shell: python
        run: |
          from pathlib import Path

          matrix = Path('.engineering/TEST_MATRIX.md')
          text = matrix.read_text(encoding='utf-8')
          if '| A-48 |' not in text:
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('| A-47 | Author-domain authentication alignment |'):
                      lines.insert(i + 1, '| A-48 | PSL-backed registrable-domain boundary | All organization/domain-equivalence decisions use the locked Public Suffix List parser with ICANN + private rules; deep suffixes, wildcard/exception rules and private multi-tenant suffixes cannot collapse unrelated registrants; bare public suffixes cannot authorize trust; author-auth fallback and link-domain comparisons reuse the same helper; no runtime DNS/registry/provider lookup is introduced | `publicSuffixDomainBoundary.test.ts`, authentication/identity/link regressions, strict type/build, locked dependency install, full corpus/Worker/server/browser gate | Windows + macOS + Ubuntu | Blocking |')
                      break
              else:
                  raise SystemExit('A-47 insertion point not found')
              text = '\n'.join(lines) + '\n'
          old = 'author-domain authentication-alignment behavior, and Analyze Links DNS-pinning/SSRF/redirect/resource-boundary behavior are automated.'
          new = 'author-domain authentication-alignment behavior, PSL-backed registrable-domain boundary behavior, and Analyze Links DNS-pinning/SSRF/redirect/resource-boundary behavior are automated.'
          if old in text:
              text = text.replace(old, new, 1)
          matrix.write_text(text, encoding='utf-8')

          register = Path('.engineering/REGRESSION_REGISTER.md')
          text = register.read_text(encoding='utf-8')
          if '| REG-058 |' not in text:
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('| REG-057 |'):
                      lines.insert(i + 1, '| REG-058 | LOCKED | Registrable-domain trust must use the locked Public Suffix List boundary rather than a handwritten last-N-label heuristic. Deep public suffixes, wildcard/exception rules and private multi-tenant suffixes must isolate unrelated registrants; a bare known public suffix must never become an organization; SPF/DKIM fallback alignment, authenticated identity and link-domain comparisons must reuse this one helper. Runtime DNS/registry/provider lookups, duplicate per-layer suffix tables and silent dependency-driven trust-boundary changes are forbidden. | `publicSuffixDomainBoundary.test.ts`, authentication/identity/link regressions, strict type/build, locked install, full corpus/Worker/server/browser gate |')
                      break
              else:
                  raise SystemExit('REG-057 insertion point not found')
              text = '\n'.join(lines) + '\n'
          if '| GAP-017 |' not in text:
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('| GAP-016 |'):
                      lines.insert(i + 1, '| GAP-017 | RESOLVED | Registrable-domain/public-suffix trust boundary | The shared organization helper previously used a last-two-label rule plus a short manual suffix list, allowing unlisted deep, wildcard or private suffixes to collapse unrelated registrants into one trust domain. Replaced that heuristic with a locked local `tldts` Public Suffix List parser using ICANN + private rules and routed all existing consumers through the same helper. Added deep-suffix, wildcard/exception, private-tenant, authentication-alignment and link-deception regressions. No runtime DNS/provider call, permission, persistence or community-schema expansion was introduced. |')
                      break
              else:
                  raise SystemExit('GAP-016 insertion point not found')
              text = '\n'.join(lines) + '\n'
          register.write_text(text, encoding='utf-8')

          readme = Path('README_REBUILD_STATUS.md')
          text = readme.read_text(encoding='utf-8')
          if 'Public Suffix List-backed registrable-domain boundary' not in text:
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('- RFC-aware author-domain authentication alignment'):
                      if line.endswith('.'):
                          lines[i] = line[:-1] + ';'
                      lines.insert(i + 1, '- Public Suffix List-backed registrable-domain boundary with ICANN/private, deep, wildcard and exception rule support, replacing handwritten suffix guesses across authentication, identity and link-domain trust decisions without runtime network lookup.')
                      break
              else:
                  raise SystemExit('README insertion point not found')
              text = '\n'.join(lines) + '\n'
          readme.write_text(text, encoding='utf-8')
      - name: Commit governance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .engineering/TEST_MATRIX.md .engineering/REGRESSION_REGISTER.md README_REBUILD_STATUS.md
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Lock PSL domain boundary governance [governance-refresh]"
          git push origin HEAD:m2-public-suffix-domain-boundary
