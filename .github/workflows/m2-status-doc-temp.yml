name: M2 status documentation temporary
on:
  push:
    branches:
      - m2-live-acceptance-readiness
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2-live-acceptance-readiness
      - shell: python
        run: |
          from pathlib import Path
          p=Path('README_REBUILD_STATUS.md'); t=p.read_text()
          t=t.replace('## Milestone 2 — IN PROGRESS','## Milestone 2 — CODE COMPLETE / LIVE ACCEPTANCE PENDING',1)
          anchor='Milestone 2 is not formally closed. The following engineering bricks are implemented and regression-locked on the current rebuild line:'
          replacement='Milestone 2 is not formally closed. The final whole-code closure audit has no remaining confirmed/reproducible code defect in the audited categories, the accepted installed dependency inventory is zero advisories, and the rebuild is ready for owner/live/deployment acceptance. Formal closure remains blocked by the registered live/deployment gaps and required manual checks. See `.engineering/MILESTONE_2_CODE_CLOSURE_AUDIT.md` and `docs/MILESTONE_2_LIVE_ACCEPTANCE.md`.\n\nThe following engineering bricks are implemented and regression-locked on the current rebuild line:'
          if anchor in t: t=t.replace(anchor,replacement,1)
          elif replacement not in t: raise SystemExit('status anchor missing')
          p.write_text(t)
      - shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README_REBUILD_STATUS.md
          git commit -m "Mark Milestone 2 ready for live acceptance"
          git push origin HEAD:m2-live-acceptance-readiness
