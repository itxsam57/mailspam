name: Temporary lock refresh

on:
  push:
    branches: [m2-public-suffix-domain-boundary]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lock-refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2-public-suffix-domain-boundary
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate locked dependency update
        run: npm install tldts@7.4.9 --save-exact -w server --package-lock-only --ignore-scripts
      - name: Commit generated manifests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package.json package-lock.json
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Add PSL-backed domain parser [lock-refresh]"
          git push origin HEAD:m2-public-suffix-domain-boundary
