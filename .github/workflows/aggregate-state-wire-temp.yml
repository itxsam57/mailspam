name: Temporary aggregate state wiring

on:
  push:
    branches: [m2-community-aggregate-state-integrity]

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[aggregate-state-wire]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2-community-aggregate-state-integrity
      - name: Wire strict decrypted-state validation
        shell: python
        run: |
          from pathlib import Path
          path = Path('server/src/community/aggregateStore.ts')
          text = path.read_text(encoding='utf-8')
          marker = 'import type { SignedFeedEntry } from "../engine/layers/globalIntelligence.js";\n'
          addition = marker + 'import { validateStoredCommunityDatabase } from "./aggregateState.js";\n'
          if 'validateStoredCommunityDatabase' not in text:
              if marker not in text: raise SystemExit('import marker missing')
              text = text.replace(marker, addition, 1)
          old = '''      const parsed = JSON.parse(plaintext) as CommunityDatabase;
      if (parsed.version !== 1 || !parsed.campaigns || typeof parsed.campaigns !== "object") throw new Error("Invalid database.");
      return parsed;'''
          new = '''      return validateStoredCommunityDatabase(JSON.parse(plaintext), MAX_CAMPAIGNS);'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('readDatabase replacement missing')
          path.write_text(text, encoding='utf-8')
      - name: Commit wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/community/aggregateStore.ts
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Validate decrypted community aggregate state [aggregate-state-wire]"
          git push origin HEAD:m2-community-aggregate-state-integrity
