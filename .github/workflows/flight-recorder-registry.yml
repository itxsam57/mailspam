name: Flight Recorder Registry Reconcile

on:
  push:
    branches:
      - design/full-product-flight-recorder-20260816

permissions:
  contents: write

jobs:
  reconcile:
    if: "${{ github.event.head_commit.message == 'chore: trigger flight recorder registry reconcile' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/full-product-flight-recorder-20260816
          fetch-depth: 0
      - name: Reconcile registry
        run: python scripts/engineering/reconcile-flight-recorder-registry.py
      - name: Commit registry
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Registry already reconciled."
            exit 1
          fi
          git config user.name "email-shield-engineering"
          git config user.email "email-shield-engineering@users.noreply.github.com"
          git add server/src/diagnostics/workflowRegistry.ts
          git commit -m "feat: register remaining traced workflows"
          git push origin HEAD:design/full-product-flight-recorder-20260816
