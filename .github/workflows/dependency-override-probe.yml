name: Temporary dependency graph probe

on:
  push:
    branches:
      - repair/canonical-session-reachability-p0-20260817

permissions:
  contents: read

jobs:
  resolve-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/canonical-session-reachability-p0-20260817
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Resolve candidate graph from a fresh lock
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const serverPath = 'server/package.json';
          const serverPkg = JSON.parse(readFileSync(serverPath, 'utf8'));
          serverPkg.dependencies.mailparser = '3.9.8';
          writeFileSync(serverPath, `${JSON.stringify(serverPkg, null, 2)}\n`);

          const rootPath = 'package.json';
          const rootPkg = JSON.parse(readFileSync(rootPath, 'utf8'));
          rootPkg.overrides = {
            'linkify-it': '5.0.2',
            'nodemailer': '9.0.5'
          };
          writeFileSync(rootPath, `${JSON.stringify(rootPkg, null, 2)}\n`);
          NODE
          mv package-lock.json /tmp/email-shield-original-package-lock.json
          npm install --package-lock-only --ignore-scripts
          echo '--- candidate lockfile size ---'
          wc -l package-lock.json
          echo '--- changed lock package entries ---'
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const before = JSON.parse(readFileSync('/tmp/email-shield-original-package-lock.json', 'utf8'));
          const after = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const keys = new Set([...Object.keys(before.packages ?? {}), ...Object.keys(after.packages ?? {})]);
          const changed = [...keys].filter((key) => JSON.stringify(before.packages?.[key] ?? null) !== JSON.stringify(after.packages?.[key] ?? null)).sort();
          console.log(`changed package entries: ${changed.length}`);
          for (const key of changed) console.log(key || '<root>');
          NODE
          echo '--- textual lock diff stats ---'
          git diff --no-index --numstat /tmp/email-shield-original-package-lock.json package-lock.json || true

      - name: Inspect and verify resolved dependency graph
        shell: bash
        run: |
          npm ci
          echo '--- resolved parser tree ---'
          npm ls mailparser html-to-text deepmerge-ts deepmerge linkify-it nodemailer --all
          echo '--- production audit ---'
          npm audit --omit=dev --audit-level=high --json | tee /tmp/email-shield-audit.json
          echo '--- full unit suite ---'
          npm run test:unit
