name: Temporary dependency graph adoption

on:
  push:
    branches:
      - repair/canonical-session-reachability-p0-20260817

permissions:
  contents: write

jobs:
  resolve-verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/canonical-session-reachability-p0-20260817
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Re-resolve only the stale parser security subgraph
        shell: bash
        run: |
          cp package-lock.json /tmp/email-shield-original-package-lock.json
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const serverPath = 'server/package.json';
          const serverPkg = JSON.parse(readFileSync(serverPath, 'utf8'));
          serverPkg.dependencies.mailparser = '3.9.8';
          writeFileSync(serverPath, `${JSON.stringify(serverPkg, null, 2)}\n`);

          const rootPath = 'package.json';
          const rootPkg = JSON.parse(readFileSync(rootPath, 'utf8'));
          rootPkg.overrides = {
            ...(rootPkg.overrides ?? {}),
            'linkify-it': '5.0.2',
            'nodemailer': '9.0.5'
          };
          writeFileSync(rootPath, `${JSON.stringify(rootPkg, null, 2)}\n`);

          const lockPath = 'package-lock.json';
          const lock = JSON.parse(readFileSync(lockPath, 'utf8'));
          const staleExact = new Set([
            'node_modules/html-to-text',
            'node_modules/deepmerge-ts',
            'node_modules/linkify-it',
            'node_modules/nodemailer'
          ]);
          for (const key of Object.keys(lock.packages ?? {})) {
            if (key === 'node_modules/mailparser' || key.startsWith('node_modules/mailparser/') || staleExact.has(key)) {
              delete lock.packages[key];
            }
          }
          writeFileSync(lockPath, `${JSON.stringify(lock, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Reject unrelated lockfile churn
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const before = JSON.parse(readFileSync('/tmp/email-shield-original-package-lock.json', 'utf8'));
          const after = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const keys = new Set([...Object.keys(before.packages ?? {}), ...Object.keys(after.packages ?? {})]);
          const changed = [...keys].filter((key) => JSON.stringify(before.packages?.[key] ?? null) !== JSON.stringify(after.packages?.[key] ?? null)).sort();
          const allowed = new Set([
            'node_modules/@selderee/plugin-htmlparser2',
            'node_modules/deepmerge',
            'node_modules/deepmerge-ts',
            'node_modules/html-to-text',
            'node_modules/html-to-text/node_modules/@selderee/plugin-htmlparser2',
            'node_modules/html-to-text/node_modules/htmlparser2',
            'node_modules/html-to-text/node_modules/leac',
            'node_modules/html-to-text/node_modules/parseley',
            'node_modules/html-to-text/node_modules/peberminta',
            'node_modules/html-to-text/node_modules/selderee',
            'node_modules/htmlparser2',
            'node_modules/htmlparser2/node_modules/entities',
            'node_modules/leac',
            'node_modules/mailparser',
            'node_modules/mailparser/node_modules/@zone-eu/mailsplit',
            'node_modules/mailparser/node_modules/@zone-eu/mailsplit/node_modules/iconv-lite',
            'node_modules/mailparser/node_modules/@zone-eu/mailsplit/node_modules/libmime',
            'node_modules/mailparser/node_modules/iconv-lite',
            'node_modules/mailparser/node_modules/libmime',
            'node_modules/nodemailer',
            'node_modules/parseley',
            'node_modules/peberminta',
            'node_modules/selderee',
            'server'
          ]);
          const unexpected = changed.filter((key) => !allowed.has(key));
          if (unexpected.length) {
            throw new Error(`Unrelated lock entries changed: ${unexpected.join(', ')}`);
          }
          if (changed.length !== allowed.size || allowed.size !== 24) {
            throw new Error(`Expected exactly 24 parser-closure lock changes, observed ${changed.length}`);
          }
          console.log(`Bounded parser lock update confirmed: ${changed.length} allowed entries only.`);
          NODE

      - name: Verify dependency graph, production audit, and unit suite
        shell: bash
        run: |
          npm ci
          npm ls mailparser html-to-text deepmerge-ts deepmerge linkify-it nodemailer --all
          npm audit --omit=dev --audit-level=high
          npm run test:unit

      - name: Commit verified package metadata only
        shell: bash
        run: |
          git add package.json server/package.json package-lock.json
          changed=$(git diff --cached --name-only)
          unexpected=$(printf '%s\n' "$changed" | grep -Ev '^(package.json|server/package.json|package-lock.json)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected dependency-adoption changes:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: remove vulnerable parser dependency chains'
          git push origin HEAD:repair/canonical-session-reachability-p0-20260817
