name: Temporary dependency graph probe

on:
  push:
    branches:
      - repair/canonical-session-reachability-p0-20260817

permissions:
  contents: write

jobs:
  resolve-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/canonical-session-reachability-p0-20260817
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Select audited mailparser dependency graph
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'server/package.json';
          const pkg = JSON.parse(readFileSync(path, 'utf8'));
          pkg.dependencies.mailparser = '3.9.8';
          writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Verify resolved dependency graph
        run: |
          npm ci
          node - <<'NODE'
          const mailparser = require('./node_modules/mailparser/package.json');
          const htmlToText = require('./node_modules/html-to-text/package.json');
          if (mailparser.version !== '3.9.8') throw new Error(`Expected mailparser 3.9.8, got ${mailparser.version}`);
          if (htmlToText.version !== '9.0.5') throw new Error(`Expected html-to-text 9.0.5, got ${htmlToText.version}`);
          try {
            const deepmergeTs = require('./node_modules/deepmerge-ts/package.json');
            throw new Error(`Vulnerable deepmerge-ts remained in the production graph at ${deepmergeTs.version}`);
          } catch (error) {
            if (error?.code !== 'MODULE_NOT_FOUND') throw error;
          }
          console.log('mailparser', mailparser.version, 'html-to-text', htmlToText.version, 'deepmerge-ts absent');
          NODE
          npm audit --omit=dev --audit-level=high
          npm run test:unit

      - name: Commit verified package metadata
        shell: bash
        run: |
          git add server/package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No package metadata changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: remove vulnerable mailparser dependency chain'
          git push origin HEAD:repair/canonical-session-reachability-p0-20260817
