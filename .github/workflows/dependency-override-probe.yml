name: Temporary dependency graph probe

on:
  push:
    branches:
      - repair/canonical-session-reachability-p0-20260817

permissions:
  contents: write

jobs:
  resolve-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/canonical-session-reachability-p0-20260817
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Select audited mailparser dependency graph
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const serverPath = 'server/package.json';
          const serverPkg = JSON.parse(readFileSync(serverPath, 'utf8'));
          serverPkg.dependencies.mailparser = '3.9.15';
          writeFileSync(serverPath, `${JSON.stringify(serverPkg, null, 2)}\n`);

          const rootPath = 'package.json';
          const rootPkg = JSON.parse(readFileSync(rootPath, 'utf8'));
          rootPkg.overrides = {
            ...(rootPkg.overrides ?? {}),
            'html-to-text': '9.0.5',
          };
          delete rootPkg.overrides.mailparser;
          writeFileSync(rootPath, `${JSON.stringify(rootPkg, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Inspect and verify resolved dependency graph
        shell: bash
        run: |
          npm ci
          echo '--- resolved parser tree ---'
          npm ls mailparser html-to-text deepmerge-ts deepmerge linkify-it nodemailer --all
          echo '--- production audit ---'
          npm audit --omit=dev --audit-level=high --json | tee /tmp/email-shield-audit.json
          echo '--- full unit suite ---'
          npm run test:unit

      - name: Commit verified package metadata
        shell: bash
        run: |
          git add package.json server/package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No package metadata changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: update audited mailparser dependency chain'
          git push origin HEAD:repair/canonical-session-reachability-p0-20260817
