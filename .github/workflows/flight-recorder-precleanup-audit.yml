name: Flight Recorder Pre-Cleanup Audit

on:
  push:
    branches:
      - design/full-product-flight-recorder-20260816

permissions:
  contents: write

jobs:
  audit:
    if: "${{ github.event.head_commit.message == 'chore: trigger flight recorder pre-cleanup audit' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/full-product-flight-recorder-20260816
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Source convergence assertions
        shell: bash
        run: |
          grep -q "X-Email-Shield-Workflow-Id" web/local-security.js
          grep -q "currentActionId" web/runtime-workflow-trace.js
          grep -q "backend_completed" server/src/diagnostics/runtimeTraceResponseBoundary.ts
          grep -q "provider_authenticated" server/src -R
          grep -q "provider_page_read" server/src -R
          grep -q "checkpoint_persisted" server/src -R
          grep -q "application.startup" server/src -R
          grep -q "provider.restore_sessions" server/src -R
          grep -q "protection.background.run" server/src -R
          grep -q "protection.realtime.run" server/src -R
          grep -q "/api/dev/runtime-trace/diagnosis" server/src/api/runtimeWorkflowTraceRoutes.ts
          grep -q "workflow_id" server/src/telemetry/technicalTelemetry.ts
          grep -q '"predev"' package.json
          grep -q 'check:runtime-trace' package.json
      - name: Browser parse
        run: |
          node --check web/runtime-workflow-trace.js
          node --check web/local-security.js
          node --check scripts/engineering/check-runtime-trace-coverage.mjs
          node --check scripts/engineering/generate-runtime-trace-manifest.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Permanent runtime trace coverage
        run: npm run check:runtime-trace
      - name: Flight recorder focused contracts
        run: npx vitest run tests/unit/runtimeWorkflowTraceV2.test.ts tests/unit/runtimeTraceCheckpoint.test.ts tests/unit/runtimeTraceManifest.test.ts tests/unit/workflowDiagnosis.test.ts tests/unit/runtimeTraceCoverage.test.ts tests/unit/runtimeWorkflowTraceBrowserV2.test.ts tests/unit/runtimeWorkflowFeatureCheckpoints.test.ts tests/unit/runtimeTraceRequestContext.test.ts tests/unit/runtimeTraceServerCoverage.test.ts tests/unit/runtimeTraceDiagnosis.test.ts tests/unit/runtimeTraceDiagnosisApi.test.ts tests/unit/runtimeWorkflowTraceTelemetry.test.ts tests/unit/runtimeWorkflowTraceTelemetryV2.test.ts
      - name: Generate exact source manifest
        env:
          EMAIL_SHIELD_BUILD_COMMIT: ${{ github.sha }}
        run: node scripts/engineering/generate-runtime-trace-manifest.mjs --output artifacts/engineering/runtime-trace-manifest.json
      - name: Mark convergence
        shell: bash
        run: |
          printf 'pre-cleanup flight recorder audit green at %s\n' "${GITHUB_SHA}" > docs/superpowers/plans/.flight-recorder-precleanup-green
          git config user.name "email-shield-engineering"
          git config user.email "email-shield-engineering@users.noreply.github.com"
          git add docs/superpowers/plans/.flight-recorder-precleanup-green
          git commit -m "test: flight recorder implementation converged"
          git push origin HEAD:design/full-product-flight-recorder-20260816
