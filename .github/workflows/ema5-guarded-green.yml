name: EMA-5 Guarded GREEN Apply

on:
  push:
    branches:
      - repair/ema-5-diagnostic-flight-recorder-p1-20260818
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'repair/ema-5-diagnostic-flight-recorder-p1-20260818') ||
      (github.event_name == 'push' && github.ref_name == 'repair/ema-5-diagnostic-flight-recorder-p1-20260818')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Guard exact RED source boundary
        shell: bash
        run: |
          set -euo pipefail
          RED=5682c82bc41cf454ed241158637c48b98b79eec0
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$RED" HEAD
          targets=(
            server/src/diagnostics/runtimeWorkflowTrace.ts
            server/src/diagnostics/workflowRegistry.ts
            web/runtime-workflow-trace.js
            web/app-shell.js
            web/consumer-provider-onboarding.js
            web/gmail-oauth.js
            web/workspace-restore.js
            web/protection-learning.js
            web/consumer-scan-results.js
            web/consumer-onboarding.js
          )
          git diff --exit-code "$RED" -- "${targets[@]}"

      - name: Materialize exact GREEN payloads
        shell: bash
        run: |
          set -euo pipefail
          materialize() {
            target="$1"
            name="$2"
            expected="$3"
            payload=".engineering/tmp/ema5/${name}.gz.b64"
            echo "${expected}  ${payload}" | sha256sum -c -
            base64 -d "$payload" | gzip -d > "$target"
          }
          materialize server/src/diagnostics/runtimeWorkflowTrace.ts runtimeWorkflowTrace 5ab72391ce13298a9fcc9247307046a39eff9d7bda8ae64cc4ad0172cb2f8c5c
          materialize server/src/diagnostics/workflowRegistry.ts workflowRegistry 0357345160a7a9e5f00ba53acd6382e4637675909aaada29d6cfae39b41c1084
          materialize web/app-shell.js app-shell d7c442f0171550ab99254e7738b1a4620671d70744678ba5f817907eef319a02
          materialize web/consumer-provider-onboarding.js consumer-provider-onboarding 30092965abc5da9b40b4667e68d49cd7d168a2b54d2545ae07dd42aa6bb923f3
          materialize web/gmail-oauth.js gmail-oauth acbb3c2ba75e4a1e1d5e7c0a4c333c4b9d7186b2b817588bcd884bc90a9665a0
          materialize web/workspace-restore.js workspace-restore 424f79e66cfcf48428e7a38a9028b9e3222d219e31e2e3e80b6c715f52bc8c81
          materialize web/protection-learning.js protection-learning 2ed6515ac6201a19d5e74ab758880811ce1ff146e6efa2d3814327e1633b6558
          materialize web/consumer-scan-results.js consumer-scan-results 3ef0c2f67b29a3b2735843298c3bdf3edb481f836a1b867fb8db38ceaaf2083c
          materialize web/consumer-onboarding.js consumer-onboarding b5bbc11b3f357f670d1f5fd3c9193f78a17cac5f3172daaa35c72ca2a53b533e
          python - <<'PY'
          from pathlib import Path
          path = Path('web/runtime-workflow-trace.js')
          text = path.read_text()
          replacements = [
              (
                  "if (outcome === 'failed' || outcome === 'rejected' || outcome === 'cancelled' || checkpointId.endsWith('.ui_confirmed')) {",
                  "if (outcome === 'failed' || outcome === 'rejected' || outcome === 'cancelled' || checkpointId.endsWith('.ui_confirmed') || checkpointId.endsWith('.completed')) {",
              ),
              (
                  "if (pathname === '/api/accounts' || pathname === '/api/accounts/connect') return pathname;",
                  "if (pathname === '/api/accounts' || pathname === '/api/accounts/connect' || pathname === '/api/accounts/workspace') return pathname;",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'guarded tracer source mismatch: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Verify GREEN contracts before commit
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            web/runtime-workflow-trace.js \
            web/app-shell.js \
            web/consumer-provider-onboarding.js \
            web/gmail-oauth.js \
            web/workspace-restore.js \
            web/protection-learning.js \
            web/consumer-scan-results.js \
            web/consumer-onboarding.js; do
            node --check "$file"
          done
          npm ci
          npm run typecheck
          npx vitest run \
            tests/unit/runtimeTraceSemanticOwnershipCurrent.test.ts \
            tests/unit/runtimeTraceRouteTemplatePrivacy.test.ts

      - name: Commit only intended GREEN production files and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .engineering/tmp/ema5
          rm -f .github/workflows/ema5-guarded-green.yml
          git add \
            server/src/diagnostics/runtimeWorkflowTrace.ts \
            server/src/diagnostics/workflowRegistry.ts \
            web/runtime-workflow-trace.js \
            web/app-shell.js \
            web/consumer-provider-onboarding.js \
            web/gmail-oauth.js \
            web/workspace-restore.js \
            web/protection-learning.js \
            web/consumer-scan-results.js \
            web/consumer-onboarding.js
          git add -u .engineering/tmp/ema5 .github/workflows/ema5-guarded-green.yml
          expected=$(mktemp)
          actual=$(mktemp)
          printf '%s\n' \
            server/src/diagnostics/runtimeWorkflowTrace.ts \
            server/src/diagnostics/workflowRegistry.ts \
            web/app-shell.js \
            web/consumer-onboarding.js \
            web/consumer-provider-onboarding.js \
            web/consumer-scan-results.js \
            web/gmail-oauth.js \
            web/protection-learning.js \
            web/runtime-workflow-trace.js \
            web/workspace-restore.js | sort > "$expected"
          git diff --cached --name-only | grep -v -E '^(\.engineering/tmp/ema5/|\.github/workflows/ema5-guarded-green\.yml$)' | sort > "$actual"
          diff -u "$expected" "$actual"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: declare canonical runtime trace ownership'
          git push origin HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
