name: EMA-5 Guarded GREEN Apply

on:
  push:
    branches:
      - repair/ema-5-diagnostic-flight-recorder-p1-20260818
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'repair/ema-5-diagnostic-flight-recorder-p1-20260818') ||
      (github.event_name == 'push' && github.ref_name == 'repair/ema-5-diagnostic-flight-recorder-p1-20260818')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Guard exact RED source boundary
        shell: bash
        run: |
          set -euo pipefail
          RED=5682c82bc41cf454ed241158637c48b98b79eec0
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$RED" HEAD
          targets=(
            server/src/diagnostics/runtimeWorkflowTrace.ts
            server/src/diagnostics/workflowRegistry.ts
            web/runtime-workflow-trace.js
            web/app-shell.js
            web/consumer-provider-onboarding.js
            web/gmail-oauth.js
            web/workspace-restore.js
            web/protection-learning.js
            web/consumer-scan-results.js
            web/consumer-onboarding.js
          )
          git diff --exit-code "$RED" -- "${targets[@]}"

      - name: Materialize exact GREEN payloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, pathlib, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          direct = {
              'server/src/diagnostics/runtimeWorkflowTrace.ts': '65174a3382a1cbb354c21cd7ec1909c838fac48f',
              'server/src/diagnostics/workflowRegistry.ts': 'f1d8987152466927ecf11a19e755d2d1a50b5cf1',
              'web/runtime-workflow-trace.js': 'ec3cb6c1d3719713ae46abad6c74c55bfd35f481',
          }
          for path, sha in direct.items():
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  payload = json.load(response)
              pathlib.Path(path).write_bytes(base64.b64decode(payload['content']))
          PY
          declare -A payloads=(
            [web/app-shell.js]=app-shell
            [web/consumer-provider-onboarding.js]=consumer-provider-onboarding
            [web/gmail-oauth.js]=gmail-oauth
            [web/workspace-restore.js]=workspace-restore
            [web/protection-learning.js]=protection-learning
            [web/consumer-scan-results.js]=consumer-scan-results
            [web/consumer-onboarding.js]=consumer-onboarding
          )
          for target in "${!payloads[@]}"; do
            base64 -d ".engineering/tmp/ema5/${payloads[$target]}.gz.b64" | gzip -d > "$target"
          done

      - name: Verify GREEN contracts before commit
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            web/runtime-workflow-trace.js \
            web/app-shell.js \
            web/consumer-provider-onboarding.js \
            web/gmail-oauth.js \
            web/workspace-restore.js \
            web/protection-learning.js \
            web/consumer-scan-results.js \
            web/consumer-onboarding.js; do
            node --check "$file"
          done
          npm ci
          npm run typecheck
          npx vitest run \
            tests/unit/runtimeTraceSemanticOwnershipCurrent.test.ts \
            tests/unit/runtimeTraceRouteTemplatePrivacy.test.ts

      - name: Commit only intended GREEN production files and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .engineering/tmp/ema5
          rm -f .github/workflows/ema5-guarded-green.yml
          git add \
            server/src/diagnostics/runtimeWorkflowTrace.ts \
            server/src/diagnostics/workflowRegistry.ts \
            web/runtime-workflow-trace.js \
            web/app-shell.js \
            web/consumer-provider-onboarding.js \
            web/gmail-oauth.js \
            web/workspace-restore.js \
            web/protection-learning.js \
            web/consumer-scan-results.js \
            web/consumer-onboarding.js
          git add -u .engineering/tmp/ema5 .github/workflows/ema5-guarded-green.yml
          expected=$(mktemp)
          actual=$(mktemp)
          printf '%s\n' \
            server/src/diagnostics/runtimeWorkflowTrace.ts \
            server/src/diagnostics/workflowRegistry.ts \
            web/app-shell.js \
            web/consumer-onboarding.js \
            web/consumer-provider-onboarding.js \
            web/consumer-scan-results.js \
            web/gmail-oauth.js \
            web/protection-learning.js \
            web/runtime-workflow-trace.js \
            web/workspace-restore.js | sort > "$expected"
          git diff --cached --name-only | grep -v -E '^(\.engineering/tmp/ema5/|\.github/workflows/ema5-guarded-green\.yml$)' | sort > "$actual"
          diff -u "$expected" "$actual"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: declare canonical runtime trace ownership'
          git push origin HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
