name: M2 dependency probe temporary
on:
  push:
    branches:
      - m2-dependency-security-closure
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/dependency-probe
          {
            echo "vitest=$(npm view vitest version)"
            echo "msal=$(npm view @azure/msal-node version)"
            echo "googleapis=$(npm view googleapis version)"
            echo "express=$(npm view express@4 version --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const v=JSON.parse(s);console.log(Array.isArray(v)?v.at(-1):v)})')"
            echo "imapflow=$(npm view imapflow version)"
            echo "mailparser=$(npm view mailparser version)"
            echo "tsx=$(npm view tsx version)"
            echo "typescript=$(npm view typescript version)"
          } > artifacts/dependency-probe/versions.txt
          npm audit --json > artifacts/dependency-probe/audit-all.json || true
          npm audit --omit=dev --json > artifacts/dependency-probe/audit-prod.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: m2-dependency-probe-${{ github.run_id }}
          path: artifacts/dependency-probe/
          retention-days: 7
