name: EMA-34 Task 4 Green

on:
  push:
    branches:
      - repair/canonical-session-reachability-p0-20260817

permissions:
  contents: write

jobs:
  apply-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/canonical-session-reachability-p0-20260817
          fetch-depth: 1

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply guarded canonical-route repair
        run: node scripts/engineering/ema34-task4-green.mjs

      - name: Verify only intended production owners changed
        shell: bash
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' \
            server/src/api/familyAwareScanStream.ts \
            server/src/api/localDesktopServer.ts \
            server/src/api/policyManagement.ts \
            server/src/api/protectionActions.ts \
            server/src/api/scanStream.ts)
          actual=$(git diff --name-only | sort)
          test "$actual" = "$expected" || {
            echo "Unexpected production diff:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          }

      - name: Strict typecheck
        run: npm run typecheck

      - name: Full unit and API regression suite
        run: npm run test:unit

      - name: Remove temporary proof machinery
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/engineering/ema34-task4-green.mjs
          rm .github/workflows/ema34-task4-green.yml

      - name: Verify final commit allowlist
        shell: bash
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' \
            .github/workflows/ema34-task4-green.yml \
            scripts/engineering/ema34-task4-green.mjs \
            server/src/api/familyAwareScanStream.ts \
            server/src/api/localDesktopServer.ts \
            server/src/api/policyManagement.ts \
            server/src/api/protectionActions.ts \
            server/src/api/scanStream.ts)
          actual=$(git diff --name-only | sort)
          test "$actual" = "$expected" || {
            echo "Unexpected final diff:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          }

      - name: Commit proven Task 4 repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "email-shield-engineering[bot]"
          git config user.email "email-shield-engineering[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reject stale reconnect sessions across API routes"
          git push origin HEAD:repair/canonical-session-reachability-p0-20260817
