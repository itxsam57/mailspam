name: Temporary passphrase descriptor hardening

on:
  push:
    branches: [m2-community-recovery-rotation]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[passphrase-fd]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2-community-recovery-rotation
      - name: Patch same-descriptor permission check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server/src/community/operations.ts')
          text = path.read_text(encoding='utf-8')
          old = '''function safeReadFile(path: string, description: string, maxBytes: number): Buffer {
            const noFollow = process.platform === "win32" ? 0 : constants.O_NOFOLLOW;
            let descriptor: number;
            try {
              descriptor = openSync(path, constants.O_RDONLY | noFollow);
            } catch {
              throw new Error(`${description} could not be opened safely.`);
            }
            try {
              const stat = fstatSync(descriptor);
              if (!stat.isFile()) throw new Error(`${description} must be a regular file.`);
              if (stat.size < 0 || stat.size > maxBytes) throw new Error(`${description} exceeds its recovery size limit.`);
              const content = readFileSync(descriptor);
              if (content.length > maxBytes) {
                content.fill(0);
                throw new Error(`${description} exceeded its recovery size limit while being read.`);
              }
              return content;
            } finally {
              closeSync(descriptor);
            }
          }
'''
          new = '''function safeReadFile(
            path: string,
            description: string,
            maxBytes: number,
            requireOwnerOnly = false,
          ): Buffer {
            const noFollow = process.platform === "win32" ? 0 : constants.O_NOFOLLOW;
            let descriptor: number;
            try {
              descriptor = openSync(path, constants.O_RDONLY | noFollow);
            } catch {
              throw new Error(`${description} could not be opened safely.`);
            }
            try {
              const stat = fstatSync(descriptor);
              if (!stat.isFile()) throw new Error(`${description} must be a regular file.`);
              if (requireOwnerOnly && process.platform !== "win32" && (stat.mode & 0o077) !== 0) {
                throw new Error(`${description} must not be accessible by group or other users.`);
              }
              if (stat.size < 0 || stat.size > maxBytes) throw new Error(`${description} exceeds its recovery size limit.`);
              const content = readFileSync(descriptor);
              if (content.length > maxBytes) {
                content.fill(0);
                throw new Error(`${description} exceeded its recovery size limit while being read.`);
              }
              return content;
            } finally {
              closeSync(descriptor);
            }
          }
'''
          if old not in text:
              raise SystemExit('safeReadFile block not found')
          text = text.replace(old, new, 1)
          old = '''export function readCommunityBackupPassphraseFile(path: string): Buffer {
            if (!existsSync(path)) throw new Error("Community backup passphrase file does not exist.");
            const stat = statSync(path);
            if (!stat.isFile() || stat.size === 0 || stat.size > MAX_PASSPHRASE_FILE_BYTES) {
              throw new Error("Community backup passphrase file must be a small regular file.");
            }
            if (process.platform !== "win32" && (stat.mode & 0o077) !== 0) {
              throw new Error("Community backup passphrase file must not be accessible by group or other users.");
            }
            const raw = safeReadFile(path, "Community backup passphrase file", MAX_PASSPHRASE_FILE_BYTES);
'''
          new = '''export function readCommunityBackupPassphraseFile(path: string): Buffer {
            if (!existsSync(path)) throw new Error("Community backup passphrase file does not exist.");
            const raw = safeReadFile(path, "Community backup passphrase file", MAX_PASSPHRASE_FILE_BYTES, true);
            if (raw.length === 0) {
              raw.fill(0);
              throw new Error("Community backup passphrase file must not be empty.");
            }
'''
          if old not in text:
              raise SystemExit('passphrase block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/community/operations.ts
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Bind passphrase permissions to opened file [passphrase-fd]"
          git push origin HEAD:m2-community-recovery-rotation
