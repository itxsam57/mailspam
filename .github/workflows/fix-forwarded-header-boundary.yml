name: Apply Forwarded Header Root Repair

on:
  push:
    branches: [fix/local-forwarded-header-boundary]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/local-forwarded-header-boundary
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply root repair and regression locks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          security = Path('server/src/api/localSecurity.ts')
          text = security.read_text()
          old = 'if (req.get("x-forwarded-host") || req.get("x-forwarded-proto") || req.get("x-forwarded-for")) {'
          new = 'if (Object.keys(req.headers).some((name) => name === "forwarded" || name.startsWith("x-forwarded-"))) {'
          if old not in text:
              raise SystemExit('Expected localSecurity forwarding guard not found')
          if new in text:
              raise SystemExit('New forwarding guard already present unexpectedly')
          security.write_text(text.replace(old, new, 1))

          test = Path('tests/unit/localApiSecurity.test.ts')
          text = test.read_text()
          old = '''    expect((await fetch(context.baseUrl, { headers: { "X-Forwarded-Host": "attacker.example" } })).status).toBe(421);\n    expect((await fetch(`${context.baseUrl}/api/security/mutation-token`, {'''
          new = '''    expect((await fetch(context.baseUrl, { headers: { "X-Forwarded-Host": "attacker.example" } })).status).toBe(421);\n    expect((await fetch(context.baseUrl, { headers: { Forwarded: "for=198.51.100.9;host=attacker.example;proto=https" } })).status).toBe(421);\n    expect((await fetch(context.baseUrl, { headers: { "X-Forwarded-Port": "443" } })).status).toBe(421);\n    expect((await fetch(`${context.baseUrl}/api/security/mutation-token`, {'''
          if old not in text:
              raise SystemExit('Expected local API security assertion block not found')
          test.write_text(text.replace(old, new, 1))

          register = Path('.engineering/REGRESSION_REGISTER.md')
          text = register.read_text()
          marker = '''| REG-085 | LOCKED | Report Scam owns local/community threat learning, not provider mailbox disposal. A successful report persists the local campaign rule, optional exact-sender block, Family Shield signal and privacy-reduced community submission while leaving the current message in place; Trash and Spam/Junk remain separate explicit actions with their own opaque-token/provider mutation boundaries. | `protectionActions.test.ts`, `reportScamActionSeparation.test.ts`, browser review-action contracts, full Engineering Gate |\n'''
          row86 = '''| REG-086 | LOCKED | Published portable artifacts must preserve every manifest-listed file that passed package verification, including hidden production-dependency files; post-verification publication may not silently filter the canonical inventory. | `portablePackagingArchitecture.test.ts`, `.github/workflows/verify.yml`, independent downloaded-artifact manifest verification, full Engineering Gate |\n'''
          row87 = '''| REG-087 | LOCKED | The local desktop server accepts only direct loopback requests: attacker Host values, standardized `Forwarded` metadata and every `X-Forwarded-*` proxy header are rejected before dashboard/API handling. | `localApiSecurity.test.ts`, compiled desktop smoke, full Windows/macOS/Ubuntu Engineering Gate |\n'''
          if marker not in text:
              raise SystemExit('REG-085 register marker not found')
          if 'REG-086 | LOCKED' not in text and 'REG-087 | LOCKED' not in text:
              text = text.replace(marker, marker + row86 + row87, 1)
          elif 'REG-087 | LOCKED' not in text:
              text = text.replace(marker, marker + row87, 1)
          register.write_text(text)
          PY
      - name: Focused verification
        run: |
          npm ci
          npx vitest run tests/unit/localApiSecurity.test.ts
          npm run typecheck
      - name: Commit root repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-forwarded-header-boundary.yml
          git add server/src/api/localSecurity.ts tests/unit/localApiSecurity.test.ts .engineering/REGRESSION_REGISTER.md .engineering/REG-087_LOCAL_FORWARDED_HEADER_BOUNDARY.md
          git commit -m "fix(security): reject all forwarded local requests"
          git push origin HEAD:fix/local-forwarded-header-boundary
