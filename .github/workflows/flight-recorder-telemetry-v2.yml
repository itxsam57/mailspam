name: Flight Recorder Telemetry V2

on:
  push:
    branches:
      - design/full-product-flight-recorder-20260816

permissions:
  contents: write

jobs:
  wire:
    if: "${{ github.event.head_commit.message == 'chore: trigger flight recorder telemetry v2' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/full-product-flight-recorder-20260816
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply strict v2 telemetry mapping
        run: python scripts/engineering/apply-flight-recorder-telemetry-v2.py
      - name: Typecheck
        run: npm run typecheck
      - name: Telemetry privacy tests
        run: npx vitest run tests/unit/runtimeWorkflowTraceTelemetry.test.ts tests/unit/runtimeWorkflowTraceTelemetryV2.test.ts tests/unit/runtimeWorkflowTraceV2.test.ts
      - name: Commit telemetry v2 mapping
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No telemetry source changes produced."
            exit 1
          fi
          git config user.name "email-shield-engineering"
          git config user.email "email-shield-engineering@users.noreply.github.com"
          git add server/src/telemetry/technicalTelemetry.ts
          git commit -m "feat: mirror safe v2 workflow checkpoints to telemetry"
          git push origin HEAD:design/full-product-flight-recorder-20260816
