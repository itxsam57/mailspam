name: Recovery limit alias temporary
on:
  push:
    branches:
      - m2-community-recoverable-storage-bound
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2-community-recoverable-storage-bound
      - shell: python
        run: |
          from pathlib import Path
          p = Path("server/src/community/operations.ts")
          s = p.read_text()
          anchor = 'import { EncryptedCommunityAggregateStore } from "./aggregateStore.js";\n'
          imp = anchor + 'import { MAX_COMMUNITY_AUTHORITATIVE_SOURCE_BYTES, MAX_COMMUNITY_SIGNING_KEY_FILE_BYTES } from "./resourceLimits.js";\n'
          if 'MAX_COMMUNITY_AUTHORITATIVE_SOURCE_BYTES' not in s:
              s = s.replace(anchor, imp, 1)
          s = s.replace('const MAX_SIGNING_KEY_FILE_BYTES = 64 * 1024;\nexport const MAX_COMMUNITY_BACKUP_SOURCE_BYTES = 192 * 1024 * 1024;\n', 'export const MAX_COMMUNITY_BACKUP_SOURCE_BYTES = MAX_COMMUNITY_AUTHORITATIVE_SOURCE_BYTES;\n')
          s = s.replace('MAX_SIGNING_KEY_FILE_BYTES', 'MAX_COMMUNITY_SIGNING_KEY_FILE_BYTES')
          marker = 'function validateSigningKeyPair(keys: CommunitySigningKeys): string {\n'
          guard = marker + '  if (Buffer.byteLength(keys.privatePem, "utf8") > MAX_COMMUNITY_SIGNING_KEY_FILE_BYTES || Buffer.byteLength(keys.publicPem, "utf8") > MAX_COMMUNITY_SIGNING_KEY_FILE_BYTES) {\n    throw new Error("Community signing key material exceeds the recovery size limit.");\n  }\n'
          if 'Community signing key material exceeds the recovery size limit.' not in s:
              s = s.replace(marker, guard, 1)
          p.write_text(s)
      - shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/src/community/operations.ts
          git commit -m "Share recovery source and signing-key limits"
          git push origin HEAD:m2-community-recoverable-storage-bound
