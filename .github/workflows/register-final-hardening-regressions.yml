name: One-shot final hardening regression registration

on:
  push:
    branches: [fix/final-release-hardening]
    paths: [.github/workflows/register-final-hardening-regressions.yml]

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-release-hardening
          fetch-depth: 0

      - name: Insert REG-082 through REG-084 into canonical register
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.engineering/REGRESSION_REGISTER.md')
          text = path.read_text()
          if '| REG-082 |' in text or '| REG-083 |' in text or '| REG-084 |' in text:
              raise SystemExit('final-hardening regression IDs are already present; refusing duplicate insertion')
          marker = '\n## Resolved registered gaps\n'
          if text.count(marker) != 1:
              raise SystemExit('canonical register insertion marker mismatch')
          rows = '''| REG-082 | LOCKED | Executable Chromium engineering smokes must never reserve a TCP port, release it and later ask Chromium to bind that stale number. Chromium owns debug-port allocation with `--remote-debugging-port=0`; the isolated profile's `DevToolsActivePort` is the only authoritative endpoint used by the gate. | `engineeringAutomation.test.ts`, executable Chromium boot/scan smokes, full Windows/macOS/Ubuntu Engineering Gate |\n| REG-083 | LOCKED | Gate Result Summary must fail closed whenever any required Windows/macOS/Ubuntu matrix result is non-successful. Diagnostic artifacts may still be printed, but a green summary can never mask a red/cancelled platform qualification. | `engineeringAutomation.test.ts`, `.github/workflows/verify.yml`, full Engineering Gate |\n| REG-084 | LOCKED | Global Shield reporter reputation is derived only from still-retained human-reviewed evidence that existed at the review decision time. Expired reviewed evidence, reopened campaigns and post-review reporter arrivals/updates cannot leave or inherit stale reputation. Reputation may change escalation weight but can never create Confirmed Threat without the human review boundary. | `globalThreatConfidence.test.ts`, `globalThreatReputationReviewBoundary.test.ts`, community retention/review regressions, full Engineering Gate |\n'''
          text = text.replace(marker, '\n' + rows + marker, 1)
          path.write_text(text)
          PY

      - name: Commit canonical registration and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/register-final-hardening-regressions.yml
          git config user.name "email-shield-engineering"
          git config user.email "engineering@email-shield.local"
          git add -A
          git commit -m "Register final release-hardening regressions"
          git push origin HEAD:fix/final-release-hardening
