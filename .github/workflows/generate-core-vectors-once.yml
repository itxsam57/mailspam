name: Generate core vectors once

on:
  push:
    branches:
      - repair/live-owner-acceptance-131-134
    paths:
      - .github/workflows/generate-core-vectors-once.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/live-owner-acceptance-131-134
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build exact engine
        run: npm run build

      - name: Regenerate committed portable-core vectors
        run: npm run generate:core-vectors

      - name: Commit generated vectors only
        shell: bash
        run: |
          set -euo pipefail
          git add fixtures/core-conformance/v1/vectors.json
          if git diff --cached --quiet; then
            echo "Core vectors were already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: regenerate portable core vectors"
          git push origin HEAD:repair/live-owner-acceptance-131-134
