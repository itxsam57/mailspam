name: Flight Recorder Task 5 Wiring

on:
  push:
    branches:
      - design/full-product-flight-recorder-20260816

permissions:
  contents: write

jobs:
  wire:
    if: "${{ github.event.head_commit.message == 'chore: trigger flight recorder Task 5 wiring' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/full-product-flight-recorder-20260816
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact Task 5 edits
        run: python scripts/engineering/apply-flight-recorder-task5.py
      - name: Parse browser sources
        run: |
          node --check web/runtime-workflow-trace.js
          node --check web/local-security.js
      - name: Typecheck server wiring
        run: npm run typecheck
      - name: Focused Task 5 tests
        run: npx vitest run tests/unit/runtimeTraceRequestContext.test.ts tests/unit/runtimeTraceServerCoverage.test.ts tests/unit/runtimeWorkflowTraceV2.test.ts tests/unit/runtimeTraceCheckpoint.test.ts
      - name: Commit Task 5 wiring
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Task 5 source changes produced."
            exit 1
          fi
          git config user.name "email-shield-engineering"
          git config user.email "email-shield-engineering@users.noreply.github.com"
          git add web/runtime-workflow-trace.js web/local-security.js server/src/diagnostics/runtimeTraceRequestContext.ts server/src/diagnostics/runtimeTraceResponseBoundary.ts server/src
          git commit -m "feat: correlate protected requests into server workflow traces"
          git push origin HEAD:design/full-product-flight-recorder-20260816
