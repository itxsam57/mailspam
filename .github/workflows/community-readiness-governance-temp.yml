name: Temporary community readiness governance refresh

on:
  push:
    branches: [m2-community-readiness-integrity]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[readiness-governance]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2-community-readiness-integrity
      - name: Apply reviewed readiness governance
        shell: python
        run: |
          from pathlib import Path

          matrix = Path('.engineering/TEST_MATRIX.md')
          text = matrix.read_text(encoding='utf-8')
          if '| A-51 |' not in text:
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('| A-50 | Community disaster recovery and signing-rotation preparation |'):
                      lines.insert(i + 1, '| A-51 | Community service readiness integrity | Public `/health` readiness is proof-based rather than a server-enabled flag: server mode plus the real aggregate-build, Ed25519 sign and self-verification path must succeed or the route returns generic HTTP 503 false booleans; successful proofs are process-cached for 15 seconds and failures for 2 seconds so unauthenticated probes cannot repeatedly rebuild/sign the feed; first-use file-managed signing-key initialization has one atomic private-key creator, contenders wait for and validate that same pair, and abandoned/invalid partial state remains fail-closed; no provider/mailbox permission or public-deployment claim is added | `communityReadinessIntegrity.test.ts`, `communitySigningInitialization.test.ts`, community API/signing/network regressions, compiled dedicated-community smoke, strict type/build, full corpus/Worker/server/browser gate | Windows + macOS + Ubuntu | Blocking |')
                      break
              else:
                  raise SystemExit('A-50 insertion point not found')
              text = '\n'.join(lines) + '\n'
          old = 'community encrypted-recovery/signing-rotation preparation behavior, and Analyze Links DNS-pinning/SSRF/redirect/resource-boundary behavior are automated.'
          new = 'community encrypted-recovery/signing-rotation preparation behavior, community service readiness/race-safe signing initialization behavior, and Analyze Links DNS-pinning/SSRF/redirect/resource-boundary behavior are automated.'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('automated handoff paragraph insertion point not found')
          matrix.write_text(text, encoding='utf-8')

          register = Path('.engineering/REGRESSION_REGISTER.md')
          text = register.read_text(encoding='utf-8')
          if '| REG-061 |' not in text:
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('| REG-060 |'):
                      lines.insert(i + 1, '| REG-061 | LOCKED | Public community readiness must prove the current aggregate -> sign -> verify path rather than mirror a configuration flag. Disabled, unreadable, un-signable or unverifiable state returns generic HTTP 503 with only service/readiness booleans and `Cache-Control: no-store`; internal paths, key material and diagnostics stay private. Healthy proofs are cached for 15 seconds and failures for 2 seconds so public probes cannot force full feed work per request. Concurrent file-managed first-use signing initialization must converge on the one atomically established private-key pair; contenders never overwrite it, while abandoned or invalid partial state remains fail-closed. Production load-balancer/monitor wiring remains GAP-004. | `communityReadinessIntegrity.test.ts`, `communitySigningInitialization.test.ts`, compiled community smoke, strict type/build, full Windows/macOS/Ubuntu engineering gate |')
                      break
              else:
                  raise SystemExit('REG-060 insertion point not found')
              text = '\n'.join(lines) + '\n'
          if '| GAP-020 |' not in text:
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('| GAP-019 |'):
                      lines.insert(i + 1, '| GAP-020 | RESOLVED | Community service readiness observation path | The public `/health` endpoint formerly claimed readiness from `serverEnabled` alone, so a process with unreadable aggregate state or unusable signed-feed publication could still advertise itself healthy. Readiness now uses the existing aggregate-build/sign/self-verify path, fails closed with generic HTTP 503, and uses short bounded process caching to avoid a probe-amplification DoS. The first full gate exposed and root-fixed a separate concurrent first-use signing-key `EEXIST` race: one atomic initializer now wins while contenders wait for and validate that exact pair; abandoned/invalid partial state remains fail-closed. GAP-004 remains open until real reverse-proxy/load-balancer monitoring wiring is deployed and accepted. |')
                      break
              else:
                  raise SystemExit('GAP-019 insertion point not found')
              text = '\n'.join(lines) + '\n'
          register.write_text(text, encoding='utf-8')

          readme = Path('README_REBUILD_STATUS.md')
          text = readme.read_text(encoding='utf-8')
          bullet = '- production community readiness integrity: `/health` now requires the real aggregate-build/sign/self-verify path, returns generic 503 on failure, bounds repeated probe cost with short process caching, and uses race-safe first-use signing-key initialization without claiming production load-balancer/monitoring acceptance.'
          if bullet not in text:
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('- encrypted community disaster-recovery tooling and signing-key rotation preparation:'):
                      if line.endswith('.'):
                          lines[i] = line[:-1] + ';'
                      lines.insert(i + 1, bullet)
                      break
              else:
                  raise SystemExit('README recovery bullet insertion point not found')
              text = '\n'.join(lines) + '\n'
          readme.write_text(text, encoding='utf-8')
      - name: Commit governance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .engineering/TEST_MATRIX.md .engineering/REGRESSION_REGISTER.md README_REBUILD_STATUS.md
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Lock community readiness governance [readiness-governance]"
          git push origin HEAD:m2-community-readiness-integrity
