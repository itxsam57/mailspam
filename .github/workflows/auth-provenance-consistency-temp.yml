name: Authentication provenance governance consistency temporary
on:
  push:
    branches:
      - m2-authentication-results-provenance
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2-authentication-results-provenance
      - shell: python
        run: |
          from pathlib import Path

          matrix = Path('.engineering/TEST_MATRIX.md')
          text = matrix.read_text()
          old = '| A-47 | Author-domain authentication alignment | Organizational trust and bounded-content Safe authentication prerequisites require RFC5322.From alignment: DMARC pass qualifies; explicit DMARC fail is authoritative negative; when DMARC is unavailable/none, only same-result RFC 8601 SPF `smtp.mailfrom` or DKIM `header.d` aligned to From may qualify; bare mechanism passes and cross-result identity borrowing are rejected; transport scores remain independent; no DNS/provider call, permission, persistence, browser or community expansion | `authenticationAlignmentIntegrity.test.ts`, generalized identity tests, strict type/build, full corpus/Worker/server/browser gate | Windows + macOS + Ubuntu | Blocking |'
          new = '| A-47 | Author-domain authentication alignment | After A-56 trusted Authentication-Results provenance is established, organizational trust and bounded-content Safe authentication prerequisites require RFC5322.From alignment: trusted DMARC pass qualifies; trusted explicit DMARC fail is authoritative negative; when trusted DMARC is unavailable/none, only same-result RFC 8601 SPF `smtp.mailfrom` or DKIM `header.d` aligned to From may qualify; bare mechanism passes and cross-result identity borrowing are rejected; untrusted results are non-authoritative under A-56; no DNS/provider call, permission, persistence, browser or community expansion | `authenticationAlignmentIntegrity.test.ts`, `authenticationResultsProvenance.test.ts`, generalized identity tests, strict type/build, full corpus/Worker/server/browser gate | Windows + macOS + Ubuntu | Blocking |'
          if old not in text and new not in text:
              raise SystemExit('A-47 anchor missing')
          text = text.replace(old, new, 1)
          matrix.write_text(text)

          register = Path('.engineering/REGRESSION_REGISTER.md')
          text = register.read_text()
          old = '| REG-057 | LOCKED | Author-domain trust must require RFC5322.From alignment, not a bare SPF/DKIM mechanism pass. DMARC pass is sufficient; explicit DMARC fail is authoritative negative; only when DMARC is unavailable/none may same-result RFC 8601 SPF `smtp.mailfrom` or DKIM `header.d` alignment establish author authentication. Passing results must not borrow identities from failed/different segments. This local metadata-only decision must not add DNS/provider calls, persistence, browser exposure or community fields. | `authenticationAlignmentIntegrity.test.ts`, generalized identity tests, strict type/build, full corpus/Worker/server/browser gate |'
          new = '| REG-057 | LOCKED | After REG-066 trusted Authentication-Results provenance is established, author-domain trust must require RFC5322.From alignment, not a bare SPF/DKIM mechanism pass. Trusted DMARC pass is sufficient; trusted explicit DMARC fail is authoritative negative; only when trusted DMARC is unavailable/none may same-result RFC 8601 SPF `smtp.mailfrom` or DKIM `header.d` alignment establish author authentication. Passing results must not borrow identities from failed/different segments. Untrusted results never enter these semantics. This local metadata-only decision must not add DNS/provider calls, persistence, browser exposure or community fields. | `authenticationAlignmentIntegrity.test.ts`, `authenticationResultsProvenance.test.ts`, generalized identity tests, strict type/build, full corpus/Worker/server/browser gate |'
          if old not in text and new not in text:
              raise SystemExit('REG-057 anchor missing')
          text = text.replace(old, new, 1)

          old = '| GAP-016 | RESOLVED | Author-domain authentication alignment path | The shared `authenticationPassed` helper formerly treated any SPF or DKIM pass as authenticating RFC5322.From, allowing unrelated mechanism identities to create organizational trust and satisfy bounded-content Safe prerequisites. Replaced that inference with DMARC-aware author alignment: DMARC pass is accepted, DMARC fail is authoritative negative, and DMARC-unavailable/none fallback requires same-result RFC 8601 `smtp.mailfrom`/`header.d` organizational alignment. No DNS/network/provider-permission/persistence/community expansion was introduced. Authentication-Results `authserv-id` provenance remains a separate future trust-boundary concern, not falsely closed here. |'
          new = '| GAP-016 | RESOLVED | Author-domain authentication alignment path | The shared `authenticationPassed` helper formerly treated any SPF or DKIM pass as authenticating RFC5322.From, allowing unrelated mechanism identities to create organizational trust and satisfy bounded-content Safe prerequisites. Replaced that inference with DMARC-aware author alignment: after trusted provenance is established, DMARC pass is accepted, DMARC fail is authoritative negative, and DMARC-unavailable/none fallback requires same-result RFC 8601 `smtp.mailfrom`/`header.d` organizational alignment. No DNS/network/provider-permission/persistence/community expansion was introduced. The separate Authentication-Results producer/provenance concern identified here was subsequently resolved fail-closed by GAP-025/REG-066 rather than by guessing live provider authserv IDs. |'
          if old not in text and new not in text:
              raise SystemExit('GAP-016 anchor missing')
          text = text.replace(old, new, 1)
          register.write_text(text)
      - shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .engineering/TEST_MATRIX.md .engineering/REGRESSION_REGISTER.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Align historical auth governance with provenance boundary"
          git push origin HEAD:m2-authentication-results-provenance
