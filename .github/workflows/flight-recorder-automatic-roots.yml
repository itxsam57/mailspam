name: Flight Recorder Automatic Roots

on:
  push:
    branches:
      - design/full-product-flight-recorder-20260816

permissions:
  contents: write

jobs:
  wire:
    if: "${{ github.event.head_commit.message == 'chore: trigger automatic flight recorder roots' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/full-product-flight-recorder-20260816
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply scoped automatic roots
        run: python scripts/engineering/apply-flight-recorder-automatic-roots.py
      - name: Typecheck
        run: npm run typecheck
      - name: Focused automatic trace tests
        run: npx vitest run tests/unit/runtimeTraceRequestContext.test.ts tests/unit/runtimeTraceServerCoverage.test.ts tests/unit/runtimeWorkflowTraceV2.test.ts tests/unit/workflowDiagnosis.test.ts
      - name: Commit automatic roots
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No automatic-root source changes produced."
            exit 1
          fi
          git config user.name "email-shield-engineering"
          git config user.email "email-shield-engineering@users.noreply.github.com"
          git add server/src
          git commit -m "feat: trace automatic startup and protection workflows"
          git push origin HEAD:design/full-product-flight-recorder-20260816
