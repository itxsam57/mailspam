name: Qualification Controller Safety Finalizer

on:
  push:
    branches:
      - design/full-product-flight-recorder-20260816

permissions:
  contents: write

jobs:
  finalize:
    if: "${{ github.event.head_commit.message == 'chore: trigger qualification controller safety finalizer' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/full-product-flight-recorder-20260816
          fetch-depth: 0
      - name: Make qualification controller external-merge safe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/email-shield-final-qualification.yml')
          source=path.read_text(encoding='utf-8')
          marker='  qualify-merge-and-requalify-main:'
          pos=source.find(marker)
          if pos < 0:
              if 'qualify-mark-ready-and-monitor-main:' in source:
                  raise SystemExit(0)
              raise SystemExit('qualification job marker missing')
          replacement=r'''  qualify-mark-ready-and-monitor-main:
    if: "${{ github.event.head_commit.message == 'chore: freeze final flight recorder qualification candidate' }}"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: "102"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/full-product-flight-recorder-20260816
          fetch-depth: 0
      - name: Require exact-head canonical Engineering Gate
        shell: bash
        run: |
          set -euo pipefail
          qualified_sha="$GITHUB_SHA"
          run_id=""
          for attempt in $(seq 1 180); do
            payload="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${qualified_sha}&per_page=100")"
            run_id="$(printf '%s' "$payload" | jq -r --arg sha "$qualified_sha" '[.workflow_runs[] | select(.name == "Engineering Gate" and .head_sha == $sha)] | sort_by(.run_number) | last | .id // empty')"
            if [ -n "$run_id" ]; then
              status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
              if [ "$status" = "completed" ]; then break; fi
            fi
            sleep 10
          done
          test -n "$run_id"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion')" = "success"
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
          printf '%s' "$jobs" | jq -e '[.jobs[] | select((.name|ascii_downcase|contains("windows")) and .conclusion=="success")] | length > 0'
          printf '%s' "$jobs" | jq -e '[.jobs[] | select((.name|ascii_downcase|contains("macos")) and .conclusion=="success")] | length > 0'
          printf '%s' "$jobs" | jq -e '[.jobs[] | select((.name|ascii_downcase|contains("ubuntu")) and .conclusion=="success")] | length > 0'
          printf '%s' "$jobs" | jq -e '[.jobs[] | select((.name|ascii_downcase|contains("summary")) and .conclusion=="success")] | length > 0'
          printf 'QUALIFIED_SHA=%s\nQUALIFIED_RUN_ID=%s\n' "$qualified_sha" "$run_id" >> "$GITHUB_ENV"
      - name: Mark exact qualified PR ready for external merge
        shell: bash
        run: |
          set -euo pipefail
          pr_head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          test "$pr_head" = "$QUALIFIED_SHA"
          is_draft="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          if [ "$is_draft" = "true" ]; then gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"; fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Exact Flight Recorder candidate qualified: \`${QUALIFIED_SHA}\`, Engineering Gate run ${QUALIFIED_RUN_ID}; Windows/macOS/Ubuntu/Summary green. Waiting for external exact-head merge so the real main push gate cannot be bypassed by GITHUB_TOKEN recursion rules."
      - name: Require external exact-head merge, then independent main gate
        shell: bash
        run: |
          set -euo pipefail
          merge_sha=""
          for attempt in $(seq 1 180); do
            merged="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json mergedAt --jq '.mergedAt // empty')"
            if [ -n "$merged" ]; then
              merge_sha="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid // empty')"
              break
            fi
            sleep 10
          done
          test -n "$merge_sha"
          run_id=""
          for attempt in $(seq 1 180); do
            payload="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${merge_sha}&per_page=100")"
            run_id="$(printf '%s' "$payload" | jq -r --arg sha "$merge_sha" '[.workflow_runs[] | select(.name == "Engineering Gate" and .head_sha == $sha)] | sort_by(.run_number) | last | .id // empty')"
            if [ -n "$run_id" ]; then
              status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
              if [ "$status" = "completed" ]; then break; fi
            fi
            sleep 10
          done
          test -n "$run_id"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion')" = "success"
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
          printf '%s' "$jobs" | jq -e '[.jobs[] | select((.name|ascii_downcase|contains("windows")) and .conclusion=="success")] | length > 0'
          printf '%s' "$jobs" | jq -e '[.jobs[] | select((.name|ascii_downcase|contains("macos")) and .conclusion=="success")] | length > 0'
          printf '%s' "$jobs" | jq -e '[.jobs[] | select((.name|ascii_downcase|contains("ubuntu")) and .conclusion=="success")] | length > 0'
          printf '%s' "$jobs" | jq -e '[.jobs[] | select((.name|ascii_downcase|contains("summary")) and .conclusion=="success")] | length > 0'
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Independent merged-main qualification passed. Main SHA: \`${merge_sha}\`; Engineering Gate run ${run_id}; Windows/macOS/Ubuntu/Summary green. Owner final live testing may begin from this exact main."
'''
          path.write_text(source[:pos]+replacement,encoding='utf-8')
          PY
      - name: Self-clean and commit safety correction
        shell: bash
        run: |
          git rm -f .github/workflows/qualification-controller-safe-finalizer.yml docs/superpowers/plans/.qualification-controller-safe-finalizer-trigger
          git config user.name "email-shield-engineering"
          git config user.email "email-shield-engineering@users.noreply.github.com"
          git add .github/workflows/email-shield-final-qualification.yml
          git commit -m "fix: keep final merge outside workflow token recursion"
          git push origin HEAD:design/full-product-flight-recorder-20260816
