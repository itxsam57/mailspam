name: Temporary community error typing

on:
  push:
    branches: [m2-community-public-error-integrity]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[community-error-types]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2-community-public-error-integrity
      - name: Apply typed community error boundaries
        shell: python
        run: |
          from pathlib import Path

          aggregate = Path('server/src/community/aggregateStore.ts')
          text = aggregate.read_text(encoding='utf-8')
          marker = 'import type { SignedFeedEntry } from "../engine/layers/globalIntelligence.js";\n'
          addition = marker + 'import { CommunityReportCapacityError, CommunityReportRateLimitError, CommunityReportValidationError } from "./errors.js";\n'
          if 'from "./errors.js"' not in text:
              if marker not in text: raise SystemExit('aggregate import marker missing')
              text = text.replace(marker, addition, 1)
          replacements = {
            'throw new Error("Unsupported community report schema.");': 'throw new CommunityReportValidationError("Unsupported community report schema.");',
            'throw new Error("Reporter proof is invalid.");': 'throw new CommunityReportValidationError("Reporter proof is invalid.");',
            'throw new Error("Campaign fingerprint is invalid.");': 'throw new CommunityReportValidationError("Campaign fingerprint is invalid.");',
            'throw new Error("Report timestamp is invalid.");': 'throw new CommunityReportValidationError("Report timestamp is invalid.");',
            'throw new Error("Report timestamp is outside the accepted submission window.");': 'throw new CommunityReportValidationError("Report timestamp is outside the accepted submission window.");',
            'throw new Error("Community report indicators are invalid.");': 'throw new CommunityReportValidationError("Community report indicators are invalid.");',
            'throw new Error("Community reporting rate limit reached for this account proof.");': 'throw new CommunityReportRateLimitError();',
            'throw new Error("Community reporting store capacity has been reached.");': 'throw new CommunityReportCapacityError();',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f'aggregate replacement missing: {old}')
          aggregate.write_text(text, encoding='utf-8')

          network = Path('server/src/community/network.ts')
          text = network.read_text(encoding='utf-8')
          marker = 'import { EncryptedCommunityAggregateStore } from "./aggregateStore.js";\n'
          addition = marker + 'import { CommunityServiceDisabledError } from "./errors.js";\n'
          if 'CommunityServiceDisabledError' not in text:
              if marker not in text: raise SystemExit('network import marker missing')
              text = text.replace(marker, addition, 1)
          text = text.replace(
              'if (!this.serverEnabled) throw new Error("Community aggregation service is disabled on this instance.");',
              'if (!this.serverEnabled) throw new CommunityServiceDisabledError();',
          )
          network.write_text(text, encoding='utf-8')
      - name: Commit typed errors
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/community/aggregateStore.ts server/src/community/network.ts
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Type public community failure classes [community-error-types]"
          git push origin HEAD:m2-community-public-error-integrity
