name: Temporary aggregate state wire simple
on:
  push:
    branches: [m2-community-aggregate-state-integrity]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2-community-aggregate-state-integrity
      - name: Wire validator
        shell: python
        run: |
          from pathlib import Path
          path = Path('server/src/community/aggregateStore.ts')
          text = path.read_text(encoding='utf-8')
          marker = 'import type { SignedFeedEntry } from "../engine/layers/globalIntelligence.js";\n'
          addition = marker + 'import { validateStoredCommunityDatabase } from "./aggregateState.js";\n'
          if 'validateStoredCommunityDatabase' not in text:
              if marker not in text:
                  raise SystemExit('import marker missing')
              text = text.replace(marker, addition, 1)
          old = '      const parsed = JSON.parse(plaintext) as CommunityDatabase;\n      if (parsed.version !== 1 || !parsed.campaigns || typeof parsed.campaigns !== "object") throw new Error("Invalid database.");\n      return parsed;'
          new = '      return validateStoredCommunityDatabase(JSON.parse(plaintext), MAX_CAMPAIGNS);'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('readDatabase replacement missing')
          path.write_text(text, encoding='utf-8')
      - name: Commit if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/community/aggregateStore.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Validate decrypted community aggregate state"
          git push origin HEAD:m2-community-aggregate-state-integrity
