name: M2 dependency upgrade temporary
on:
  push:
    branches:
      - m2-dependency-security-closure
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2-dependency-security-closure
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply reviewed security upgrades
        shell: bash
        run: |
          set -euo pipefail
          npm install -w server @azure/msal-node@5.5.0 googleapis@174.0.1
          npm install -D -w server vitest@4.1.10
      - name: Focused compatibility challenge
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
          npx vitest run \
            tests/unit/microsoftOAuthSecurity.test.ts \
            tests/unit/microsoftOAuthCompatibility.test.ts \
            tests/unit/outlookRefreshRotation.test.ts \
            tests/unit/outlookVaultCustody.test.ts \
            tests/unit/outlookDisconnectSemantics.test.ts \
            tests/unit/gmailOAuthSecurity.test.ts \
            tests/unit/gmailOAuthGoogleCompatibility.test.ts \
            tests/unit/gmailOAuthRevocation.test.ts \
            tests/unit/credentialVault.test.ts \
            tests/unit/secureSessionCredentials.test.ts
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
      - name: Commit only after compatibility passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/package.json package-lock.json
          git commit -m "Upgrade security-sensitive dependencies"
          git push origin HEAD:m2-dependency-security-closure
