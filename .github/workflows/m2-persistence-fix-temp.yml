name: M2 persistence fix temporary
on:
  push:
    branches:
      - m2-final-closure-audit
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2-final-closure-audit
      - shell: bash
        run: |
          set -euo pipefail
          base64 -d .engineering/tmp-persistence-patch.gz.b64 | gzip -d > /tmp/persistence.patch
          git apply -p1 /tmp/persistence.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/src tests/unit
          git commit -m "Harden local persistence file integrity"
          git push origin HEAD:m2-final-closure-audit
