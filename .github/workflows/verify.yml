name: Engineering Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: engineering-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Engineering Gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run full applicable engineering gate
        run: npm run gate
        env:
          ENGINEERING_AUDIT: ${{ runner.os == 'Linux' && '1' || '0' }}

      - name: Upload verification and browser handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-shield-engineering-${{ runner.os }}-${{ github.run_id }}
          path: artifacts/engineering/
          if-no-files-found: error
          retention-days: 14

  summarize:
    name: Gate Result Summary
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download verification artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: email-shield-engineering-*-${{ github.run_id }}
          path: gate-artifacts

      - name: Print concise reports
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r report; do
            found=1
            echo ""
            echo "===== ${report} ====="
            cat "${report}"
            {
              echo ""
              echo "## $(dirname "${report}" | sed 's#gate-artifacts/##')"
              cat "${report}"
            } >> "$GITHUB_STEP_SUMMARY"
          done < <(find gate-artifacts -name VERIFICATION_REPORT.md -type f | sort)
          if [ "$found" -eq 0 ]; then
            echo "No verification reports were downloaded." >&2
            exit 1
          fi
