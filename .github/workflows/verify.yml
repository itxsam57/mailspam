name: Engineering Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineering-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Engineering Gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run full applicable engineering gate
        run: npm run gate
        env:
          ENGINEERING_AUDIT: ${{ runner.os == 'Linux' && '1' || '0' }}

      - name: Upload verification and browser handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-shield-engineering-${{ runner.os }}-${{ github.run_id }}
          path: artifacts/engineering/
          if-no-files-found: error
          retention-days: 14
