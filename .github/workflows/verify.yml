name: Engineering Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: engineering-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Engineering Gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      EMAIL_SHIELD_GOOGLE_CLIENT_ID: ${{ vars.EMAIL_SHIELD_GOOGLE_CLIENT_ID }}
      EMAIL_SHIELD_MICROSOFT_CLIENT_ID: ${{ vars.EMAIL_SHIELD_MICROSOFT_CLIENT_ID }}
      EMAIL_SHIELD_REQUIRE_LIVE_OAUTH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}

    steps:
      - name: Checkout immutable tested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Assert immutable tested SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA" || {
            echo "Expected immutable test SHA $EXPECTED_SHA but checkout is $actual" >&2
            exit 1
          }
          echo "Exact tested SHA: $actual"

      - name: Assert consumer OAuth release registration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EMAIL_SHIELD_GOOGLE_CLIENT_ID:-}" || {
            echo "Consumer release blocked: repository variable EMAIL_SHIELD_GOOGLE_CLIENT_ID is missing." >&2
            exit 1
          }
          test -n "${EMAIL_SHIELD_MICROSOFT_CLIENT_ID:-}" || {
            echo "Consumer release blocked: repository variable EMAIL_SHIELD_MICROSOFT_CLIENT_ID is missing." >&2
            exit 1
          }
          echo "Consumer OAuth application registrations are provisioned."

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Linux Secret Service test dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libsecret-tools gnome-keyring dbus-x11

      - name: Run full engineering gate with Linux Secret Service
        if: runner.os == 'Linux'
        shell: bash
        env:
          ENGINEERING_AUDIT: '1'
          ENGINEERING_CAPACITY_STRESS: '1'
        run: |
          dbus-run-session -- bash -lc '
            set -euo pipefail
            export EMAIL_SHIELD_TEST_SECRET_SERVICE=1
            printf "%s" "email-shield-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets >/tmp/email-shield-keyring-env
            while IFS= read -r line; do
              case "$line" in
                GNOME_KEYRING_CONTROL=*|SSH_AUTH_SOCK=*) export "$line" ;;
              esac
            done </tmp/email-shield-keyring-env
            rm -f /tmp/email-shield-keyring-env
            npm run gate
          '

      - name: Run full applicable engineering gate
        if: runner.os != 'Linux'
        run: npm run gate
        env:
          ENGINEERING_AUDIT: '0'

      - name: Persist failure diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p artifacts/engineering
          set +e
          npm run typecheck > artifacts/engineering/typecheck-failure.log 2>&1
          typecheck_status=$?
          npm run build > artifacts/engineering/build-failure.log 2>&1
          build_status=$?
          npm run check:core > artifacts/engineering/portable-core-failure.log 2>&1
          core_status=$?
          npm run check:core-vectors > artifacts/engineering/core-vectors-failure.log 2>&1
          vectors_status=$?
          npm run test:unit > artifacts/engineering/unit-failure.log 2>&1
          unit_status=$?
          tested_sha="$(git rev-parse HEAD 2>/dev/null || printf unknown)"
          {
            echo "runner: ${RUNNER_OS}"
            echo "commit: ${tested_sha}"
            echo "typecheck diagnostic rerun exit: ${typecheck_status}"
            echo "build diagnostic rerun exit: ${build_status}"
            echo "portable-core diagnostic rerun exit: ${core_status}"
            echo "core-vectors diagnostic rerun exit: ${vectors_status}"
            echo "unit diagnostic rerun exit: ${unit_status}"
          } > artifacts/engineering/failure-diagnostics-metadata.txt
          exit 0

      - name: Upload verification and browser handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-shield-engineering-${{ runner.os }}-${{ github.run_id }}
          path: artifacts/engineering/
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified portable package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-shield-portable-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          path: artifacts/release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  summarize:
    name: Gate Result Summary
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download verification artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: email-shield-engineering-*-${{ github.run_id }}
          path: gate-artifacts

      - name: Print concise reports and enforce platform result
        shell: bash
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r report; do
            found=1
            echo ""
            echo "===== ${report} ====="
            cat "${report}"
            {
              echo ""
              echo "## $(dirname "${report}" | sed 's#gate-artifacts/##')"
              cat "${report}"
            } >> "$GITHUB_STEP_SUMMARY"
          done < <(find gate-artifacts -name VERIFICATION_REPORT.md -type f | sort)
          if [ "$found" -eq 0 ]; then
            echo "No verification reports were downloaded." >&2
            exit 1
          fi

          while IFS= read -r diagnostic; do
            echo ""
            echo "===== FAILURE DIAGNOSTIC: ${diagnostic} ====="
            tail -n 240 "${diagnostic}"
          done < <(find gate-artifacts \( -name '*-failure.log' -o -name 'failure-diagnostics-metadata.txt' \) -type f | sort)

          if [ "$VERIFY_RESULT" != "success" ]; then
            echo "One or more platform engineering gates failed: ${VERIFY_RESULT}" >&2
            exit 1
          fi
