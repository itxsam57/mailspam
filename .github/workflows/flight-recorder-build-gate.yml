name: Flight Recorder Build Gate Wiring

on:
  push:
    branches:
      - design/full-product-flight-recorder-20260816

permissions:
  contents: write

jobs:
  wire:
    if: "${{ github.event.head_commit.message == 'chore: trigger flight recorder build gate wiring' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/full-product-flight-recorder-20260816
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply build/gate wiring
        run: python scripts/engineering/apply-flight-recorder-build-gate.py
      - name: Parse coverage script
        run: node --check scripts/engineering/check-runtime-trace-coverage.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Run permanent trace coverage
        run: npm run check:runtime-trace
      - name: Generate manifest
        env:
          EMAIL_SHIELD_BUILD_COMMIT: ${{ github.sha }}
        run: node scripts/engineering/generate-runtime-trace-manifest.mjs --output artifacts/engineering/runtime-trace-manifest.json
      - name: Commit build/gate wiring
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No build/gate source changes produced."
            exit 1
          fi
          git config user.name "email-shield-engineering"
          git config user.email "email-shield-engineering@users.noreply.github.com"
          git add package.json scripts/engineering/generate-runtime-trace-manifest.mjs server/src/diagnostics/runtimeWorkflowTrace.ts .github/workflows
          git commit -m "test: make full-product tracing a permanent engineering gate"
          git push origin HEAD:design/full-product-flight-recorder-20260816
