name: Storage key governance temporary
on:
  push:
    branches:
      - m2-community-storage-key-read-integrity
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2-community-storage-key-read-integrity
      - shell: python
        run: |
          from pathlib import Path

          matrix = Path('.engineering/TEST_MATRIX.md')
          text = matrix.read_text()
          if '| A-55 |' not in text:
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('| A-54 | Recoverable community aggregate storage boundary |'):
                      lines.insert(i + 1, '| A-55 | Community storage-key read integrity | The existing 32-byte aggregate encryption key keeps its atomic `wx` creation/`EEXIST` contender contract, but runtime loading must open the exact key path read-only with no-follow where supported, prove the opened descriptor is a regular file of exactly `COMMUNITY_STORAGE_KEY_BYTES` before reading, read from that same descriptor, reject size changes, zero the generated candidate buffer after create attempt and cache only validated key bytes; malformed/oversized key files and POSIX symlinks fail closed; no key-location/format/custody/provider/mailbox/deployment expansion is added | `communityStorageKeyReadIntegrity.test.ts`, aggregate/recovery/storage-boundary regressions, strict type/build, full corpus/Worker/server/browser gate | Windows + macOS + Ubuntu | Blocking |')
                      break
              else:
                  raise SystemExit('A-54 insertion point missing')
              text = '\n'.join(lines) + '\n'
          old = 'recoverable community aggregate storage-boundary behavior, and Analyze Links DNS-pinning/SSRF/redirect/resource-boundary behavior are automated.'
          new = 'recoverable community aggregate storage-boundary behavior, community aggregate storage-key read-integrity behavior, and Analyze Links DNS-pinning/SSRF/redirect/resource-boundary behavior are automated.'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('matrix automated paragraph missing')
          matrix.write_text(text)

          register = Path('.engineering/REGRESSION_REGISTER.md')
          text = register.read_text()
          if '| REG-065 |' not in text:
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('| REG-064 |'):
                      lines.insert(i + 1, '| REG-065 | LOCKED | Community aggregate encryption-key loading must not read arbitrary path content before validating the existing exact 32-byte key contract. Atomic `wx` creation and `EEXIST` contender behavior remain; generated candidate bytes are zeroed after the create attempt; runtime opens the key read-only with no-follow where supported, fstats that same descriptor as a regular file of exactly `COMMUNITY_STORAGE_KEY_BYTES`, reads from the same descriptor, rechecks read length, and caches only validated bytes. Wrong-size/oversized key files and POSIX symlinks fail closed without regeneration or normalization. Key location/format/custody and provider/mailbox/deployment boundaries remain unchanged. | `communityStorageKeyReadIntegrity.test.ts`, aggregate/recovery/storage-boundary regressions, strict type/build, full Windows/macOS/Ubuntu engineering gate |')
                      break
              else:
                  raise SystemExit('REG-064 insertion point missing')
              text = '\n'.join(lines) + '\n'
          if '| GAP-024 |' not in text:
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('| GAP-023 |'):
                      lines.insert(i + 1, '| GAP-024 | RESOLVED | Aggregate storage-key pre-allocation/read-integrity path | The community aggregate store already required a 32-byte encryption key but loaded the path with `readFileSync` before checking length and followed POSIX symlinks. Runtime key loading now preserves atomic first-use creation while using same-descriptor regular-file/exact-size validation before key-byte reading, no-follow where supported, defensive read-length validation and generated-candidate zeroing. This is local file-read integrity only and does not change key custody, format or GAP-004 deployment acceptance. |')
                      break
              else:
                  raise SystemExit('GAP-023 insertion point missing')
              text = '\n'.join(lines) + '\n'
          register.write_text(text)

          readme = Path('README_REBUILD_STATUS.md')
          text = readme.read_text()
          bullet = '- community aggregate storage-key read integrity: the existing 32-byte local encryption key now preserves atomic creation while using same-descriptor regular-file/exact-size validation, no-follow where supported, generated-buffer zeroing and fail-closed malformed/symlink handling before key bytes are cached.'
          if bullet not in text:
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('- recoverable community aggregate storage boundary:'):
                      if line.endswith('.'):
                          lines[i] = line[:-1] + ';'
                      lines.insert(i + 1, bullet)
                      break
              else:
                  raise SystemExit('README insertion point missing')
              text = '\n'.join(lines) + '\n'
          readme.write_text(text)
      - shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .engineering/TEST_MATRIX.md .engineering/REGRESSION_REGISTER.md README_REBUILD_STATUS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Lock storage-key read integrity governance"
          git push origin HEAD:m2-community-storage-key-read-integrity
